# INET versions whose documentation is published under https://inet.omnetpp.org/docs/<label>/.
#
# label   path component and name in the version switcher
# ref     git branch or tag in the INET repository; the version without a ref (at most one) is built from
#         the INET tree that runs the build, i.e. the website branch on the site
# latest  the version that /docs/latest/, the old /docs/<manual>/ URLs and the site's links point to;
#         exactly one version must have it
# parts   optional subset of: users-guide, developers-guide, migration-guide, showcases, tutorials,
#         python-api, api (default: all)
#
# Releasing a new INET version: add it here (usually as the new latest), and prune old entries when
# the site approaches the GitHub Pages size limit.

inet_repository = "https://github.com/inet-framework/inet.git"
media_repository = "https://github.com/inet-framework/media.git"

[[version]]
label = "4.7"
ref = "v4.7.0"
latest = true

[[version]]
label = "dev"

[[version]]
label = "3.8"
ref = "v3.8.5"
parts = ["api"]
