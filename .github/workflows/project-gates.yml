name: "Check: project gates"

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    # nothing

permissions:
  contents: read

jobs:
  project-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run enforcement checker tests
        run: python3 -m unittest discover -v -s doc/project/enforcement -p 'test_*.py'
      - name: Check pre-existing source seals
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: doc/project/enforcement/check-source-seals.sh --base "$BASE_SHA"
