name: "Test: protocol"

on:
  push:
    branches:
      - master
  workflow_dispatch:
    # nothing

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # TODO: add debug/release mode when it becomes supported
        # MODEs or executables based on command line arguments or envvars
        mode: ["debug"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          repository: omnetpp/omnetpp
          path: omnetpp
          ref: omnetpp-6.x
      - uses: actions/checkout@v6
        with:
          path: inet
      # the packetdrill wrappers in tests/protocol/tcp/{linux,packetdrill} run the scripts of
      # inet-gpl; without it they skip
      - uses: actions/checkout@v6
        with:
          repository: inet-framework/inet-gpl
          path: inet-gpl
      - run: mkdir -p /home/runner/work/ccache
      - uses: actions/cache/restore@v5
        with:
          path: /home/runner/work/ccache
          key: native-${{ matrix.mode }}-ccache-${{ github.run_id }}
          # See: https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          restore-keys: native-${{ matrix.mode }}-ccache
      - name: Build and test
        env:
          MODE: ${{ matrix.mode }}
        run: |
          echo "::group::Installing packages"
          sudo apt update
          sudo apt install -y --no-install-recommends git wget curl ca-certificates \
            make ccache clang lld gdb bison flex perl doxygen graphviz libxml2-dev zlib1g-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libz3-dev libopenscenegraph-dev python3
          echo "::endgroup::"

          source $GITHUB_WORKSPACE/inet/_scripts/github/build-omnetpp.sh

          echo "::group::Installing pip"
          sudo apt install -y python3-pip
          echo "::endgroup::"

          echo "::group::Installing Python packages"
          python3 -m venv $GITHUB_WORKSPACE/venv
          source $GITHUB_WORKSPACE/venv/bin/activate
          python3 -m pip install -r $GITHUB_WORKSPACE/omnetpp/python/requirements.txt
          python3 -m pip install -r $GITHUB_WORKSPACE/inet/python/requirements.txt
          python3 -m pip install pyyaml  # inet-gpl's packetdrill suite reads its YAML configuration
          echo "::endgroup::"

          source $GITHUB_WORKSPACE/inet/_scripts/github/build-inet.sh

          echo "::group::Compiling inet-gpl and its packetdrill runner"
          cd $GITHUB_WORKSPACE/inet-gpl
          . setenv -q
          make makefiles
          make MODE=$MODE -j $(nproc)
          make -C tests/packetdrill build
          cd $GITHUB_WORKSPACE/inet
          echo "::endgroup::"

          echo "::group::Checking that the packetdrill wrappers can run"
          # one script that passes: a missing or broken inet-gpl fails the job here, instead of
          # turning the 306 packetdrill wrappers into 306 skips
          inet_run_packetdrill tcp/packetdrill/fast_retransmit/fr-4pkt-sack | tail -1 \
            | grep -qx 'PACKETDRILL tcp/packetdrill/fast_retransmit/fr-4pkt-sack: PASS'
          echo "::endgroup::"

          echo "::group::Running protocol tests"
          inet_run_protocol_tests
          echo "::endgroup::"
