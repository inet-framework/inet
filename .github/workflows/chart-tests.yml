name: "Test: chart"

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    # nothing

permissions:
  contents: read

jobs:
  changes:
    name: Paths that can change a result
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - name: Select the paths of the pull request
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # a push and a run by hand test the branch; a pull request runs the tests only when it
          # changes a path that can change a chart result, and else the check passes
          if [ -z "$NUMBER" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths='^(src|examples|showcases|tutorials|tests/networks|tests/validation|python|_scripts|bin)/'
          paths+='|^(inet\.opp|\.oppfeatures|\.oppfeaturestate\.default|Makefile|setenv)$'
          paths+='|^\.github/workflows/chart-tests\.yml$|^doc/project/enforcement/baseline_'
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$NUMBER/files" --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
          if grep -qE "$paths" "$RUNNER_TEMP/files.txt"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No path of the pull request can change a chart result; the tests do not run." >> "$GITHUB_STEP_SUMMARY"
          fi

  chart-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # runs-on: [self-hosted, linux]
    strategy:
      matrix:
        mode: ["release"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          repository: omnetpp/omnetpp
          path: omnetpp
          ref: omnetpp-6.x
      - uses: actions/checkout@v6
        with:
          path: inet
          persist-credentials: false
      - run: mkdir -p /home/runner/work/ccache
      - uses: actions/cache/restore@v5
        with:
          path: /home/runner/work/ccache
          key: native-${{ matrix.mode }}-ccache-${{ github.run_id }}
          # See: https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          restore-keys: native-${{ matrix.mode }}-ccache
      - name: Build and test
        env:
          MODE: ${{ matrix.mode }}
        run: |
          echo "::group::Installing packages"
          sudo apt update
          sudo apt install -y --no-install-recommends git wget curl ca-certificates \
            make ccache clang lld gdb bison flex perl doxygen graphviz libxml2-dev zlib1g-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libz3-dev libopenscenegraph-dev \
            python3 python3-venv
          echo "::endgroup::"

          source $GITHUB_WORKSPACE/inet/_scripts/github/build-omnetpp.sh

          echo "::group::Installing opp_repl"
          python3 -m venv $GITHUB_WORKSPACE/venv
          source $GITHUB_WORKSPACE/venv/bin/activate
          # the chart test draws the charts with omnetpp.scave, which needs these packages
          python3 -m pip install -r $GITHUB_WORKSPACE/omnetpp/python/requirements.txt
          python3 -m pip install "opp_repl @ git+https://github.com/omnetpp/opp_repl.git@github_ci"
          echo "::endgroup::"

          source $GITHUB_WORKSPACE/inet/_scripts/github/build-inet.sh

          echo "::group::Reclaiming some disk space"
          rm -rf $GITHUB_WORKSPACE/omnetpp/out
          rm -rf $GITHUB_WORKSPACE/inet/out
          ccache -cCz
          echo "::endgroup::"

          echo "::group::Checking out the inet media repository"
          # inet.opp pins the commit of the media repository that this INET commit passes with;
          # the command prints the commit
          opp_checkout_test_baselines --load $INET_ROOT -p inet chart
          echo "::endgroup::"

          echo "::group::Running chart tests"
          # INET's inet.opp gives the baseline folder (media) and the filter showcases; --no-build
          # keeps the test from a new build of INET, because the disk reclaim removed the objects
          set +e
          opp_run_chart_tests --load $INET_ROOT -p inet -m $MODE --no-build --result-file "$RUNNER_TEMP/chart.json"
          status=$?
          set -e
          echo "::endgroup::"

          if [ "$status" -ne 0 ]; then
            echo "::group::Making the candidate baseline files"
            # the candidates are evidence for the author, not a baseline: see doc/project/guide/change-a-baseline.md
            cd $INET_ROOT
            python3 _scripts/github/baseline-candidates.py chart "$RUNNER_TEMP/chart.json" "$GITHUB_WORKSPACE/candidates" \
              --update "opp_update_chart_test_results --load $INET_ROOT -p inet -m $MODE --no-build" > "$RUNNER_TEMP/candidates.txt" 2>&1 || true
            cat "$RUNNER_TEMP/candidates.txt"
            echo "::endgroup::"
            {
              echo "## The chart tests fail"
              echo
              echo "If the change moves these results on purpose, the artifact \`chart-candidates\` holds the new files, recorded"
              echo "in this CI environment, with \`moved-results.txt\` and \`environment.txt\`. Leave out the files of the tests"
              echo "that fail at the parent commit too, commit the rest to the baseline repository with the record, and move"
              echo "the pin in the commit that causes the change. The procedure is in doc/project/guide/change-a-baseline.md."
              echo
              echo '```'
              sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/candidates.txt" | grep -E '^(error|warning)|need a candidate|candidate file' || true
              cat "$GITHUB_WORKSPACE/candidates/moved-results.txt" 2>/dev/null || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always() # even if the test failed, of course
        with:
          name: chart-test-results
          path: |
            ${{ github.workspace }}/inet/media/**/*-new.png
            ${{ github.workspace }}/inet/media/**/*-diff.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chart-candidates
          path: ${{ github.workspace }}/candidates
          if-no-files-found: ignore
