name: "Test: validation"

on:
  push:
    branches:
      - master
  workflow_dispatch:
    # nothing

jobs:
  validation-tests:
    runs-on: ubuntu-latest
    # runs-on: [self-hosted, linux]
    strategy:
      matrix:
        mode: ["release"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
        with:
          repository: omnetpp/omnetpp
          path: omnetpp
          ref: omnetpp-6.x
      - uses: actions/checkout@v6
        with:
          path: inet
      - run: mkdir -p /home/runner/work/ccache
      - uses: actions/cache/restore@v5
        with:
          path: /home/runner/work/ccache
          key: native-${{ matrix.mode }}-ccache-${{ github.run_id }}
          # See: https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          restore-keys: native-${{ matrix.mode }}-ccache
      - name: Build and test
        env:
          MODE: ${{ matrix.mode }}
        run: |
          echo "::group::Installing packages"
          sudo apt update
          sudo apt install -y --no-install-recommends git wget curl ca-certificates \
            make ccache clang lld gdb bison flex perl doxygen graphviz libxml2-dev zlib1g-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libz3-dev libopenscenegraph-dev \
            python3 python3-venv
          echo "::endgroup::"

          source $GITHUB_WORKSPACE/inet/_scripts/github/build-omnetpp.sh

          echo "::group::Installing opp_repl"
          python3 -m venv $GITHUB_WORKSPACE/venv
          source $GITHUB_WORKSPACE/venv/bin/activate
          # the validation tests read the results with omnetpp.scave, which needs these packages
          python3 -m pip install -r $GITHUB_WORKSPACE/omnetpp/python/requirements.txt
          python3 -m pip install "opp_repl @ git+https://github.com/omnetpp/opp_repl.git@github_ci"
          echo "::endgroup::"

          source $GITHUB_WORKSPACE/inet/_scripts/github/build-inet.sh

          echo "::group::Running validation tests"
          # INET's inet.opp names INET's validation module as the runner, which applies no project
          # defaults, so the command gives the mode
          opp_run_validation_tests --load $INET_ROOT -p inet -m $MODE
          echo "::endgroup::"
