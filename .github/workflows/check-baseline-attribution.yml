name: "Check: baseline attribution"

# The attribution run of the baseline changes of a pull request (TR-BASELINE-ATTRIBUTION and
# TR-BASELINE-PARENT in doc/project/rule/testing.md), through check-baseline-attribution.sh. For each
# commit that moves a baseline pin over a result, the job runs the moved tests at the parent with the
# old pins, at the commit with the new pins, and with the reduction of a forward or reverse
# attribution. A pull request that moves no pin over a result needs no run, and the check passes.
#
# The job builds and runs content of the pull request, so it runs on pull_request, with a read-only
# token. It runs the tool from a copy, because the runs check out other commits in the work tree.

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: baseline-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attribution:
    name: Attribution runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: inet
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan the runs
        id: plan
        working-directory: inet
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --no-tags origin "$BASE_SHA"
          range="$(git merge-base "$BASE_SHA" HEAD)..$(git rev-parse HEAD)"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          cp -r doc/project/enforcement "$RUNNER_TEMP/enforcement"
          "$RUNNER_TEMP/enforcement/check-baseline-attribution.sh" plan "$range" | tee "$RUNNER_TEMP/plan.txt"
          if grep -q "No run is necessary" "$RUNNER_TEMP/plan.txt"; then
            echo "runs=false" >> "$GITHUB_OUTPUT"
            echo "No commit of the pull request moves a baseline pin over a result; no run is necessary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "runs=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.plan.outputs.runs == 'true'
        with:
          repository: omnetpp/omnetpp
          path: omnetpp
          ref: omnetpp-6.x
      - run: mkdir -p /home/runner/work/ccache
        if: steps.plan.outputs.runs == 'true'
      - uses: actions/cache/restore@v5
        if: steps.plan.outputs.runs == 'true'
        with:
          path: /home/runner/work/ccache
          key: native-release-ccache-${{ github.run_id }}
          # See: https://github.com/actions/cache/blob/main/tips-and-workarounds.md#update-a-cache
          restore-keys: native-release-ccache
      - name: Build and run
        if: steps.plan.outputs.runs == 'true'
        env:
          MODE: release
          RANGE: ${{ steps.plan.outputs.range }}
        run: |
          echo "::group::Installing packages"
          sudo apt update
          sudo apt install -y --no-install-recommends git wget curl ca-certificates \
            make ccache clang lld gdb bison flex perl doxygen graphviz libxml2-dev zlib1g-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libz3-dev libopenscenegraph-dev \
            python3 python3-venv
          echo "::endgroup::"

          source $GITHUB_WORKSPACE/inet/_scripts/github/build-omnetpp.sh

          echo "::group::Installing opp_repl"
          python3 -m venv $GITHUB_WORKSPACE/venv
          source $GITHUB_WORKSPACE/venv/bin/activate
          python3 -m pip install -r $GITHUB_WORKSPACE/omnetpp/python/requirements.txt
          python3 -m pip install "opp_repl @ git+https://github.com/omnetpp/opp_repl.git@github_ci"
          echo "::endgroup::"

          # the environment of INET for the runs; each run builds its commit again
          source $GITHUB_WORKSPACE/inet/_scripts/github/build-inet.sh

          cat > "$RUNNER_TEMP/build.sh" <<'END'
          set -e
          cd "$GITHUB_WORKSPACE/inet"
          # a generated message file whose .msg file is not in this commit must not go into the library
          find src -name '*_m.cc' -o -name '*_m.h' | while read -r f; do [ -f "${f%_m.*}.msg" ] || rm -f "$f"; done
          opp_featuretool enable all
          make makefiles
          make MODE=release -j"$(nproc)"
          END
          echo 'exec opp_checkout_test_baselines --load "$GITHUB_WORKSPACE/inet" -p inet' > "$RUNNER_TEMP/checkout.sh"
          echo 'exec opp_run_statistical_tests --load "$GITHUB_WORKSPACE/inet" -p inet -m release --no-build "$@"' > "$RUNNER_TEMP/statistical.sh"
          echo 'exec opp_run_chart_tests --load "$GITHUB_WORKSPACE/inet" -p inet -m release --no-build "$@"' > "$RUNNER_TEMP/chart.sh"

          cd $GITHUB_WORKSPACE/inet
          set +e
          "$RUNNER_TEMP/enforcement/check-baseline-attribution.sh" run "$RANGE" --log-folder "$RUNNER_TEMP/attribution" \
            --build "bash $RUNNER_TEMP/build.sh" --checkout "bash $RUNNER_TEMP/checkout.sh" \
            --statistical "bash $RUNNER_TEMP/statistical.sh" --chart "bash $RUNNER_TEMP/chart.sh" | tee "$RUNNER_TEMP/attribution.txt"
          status=${PIPESTATUS[0]}
          set -e
          { echo "## Attribution runs"; echo; echo '```'; cat "$RUNNER_TEMP/attribution.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always() && steps.plan.outputs.runs == 'true'
        with:
          name: attribution-logs
          path: ${{ runner.temp }}/attribution
          if-no-files-found: ignore
