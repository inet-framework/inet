[General]
network = CellularNetwork
sim-time-limit = 20ms
**.radioMedium.pathLoss.alpha = 3
# carrier 0: TDD, 3.5 GHz, 30 kHz, 100 MHz
**.radio[0].downlinkFrequency = 3.5GHz
**.radio[0].subcarrierSpacing = 30kHz
**.radio[0].numPrbs = 273
**.gnb[*].sector[*].panel[*].numBeams = 8

[Config Tiny]
description = "One site, one TDD carrier, 9 UEs: a smoke test"
*.numUesPerSector = 3

[Config TwoCarriers]
abstract = true
*.numCarriers = 2
*.numBands = 2
# carrier 1: FDD, 2.14 GHz downlink and 1.95 GHz uplink, 15 kHz, 20 MHz, on the second band
**.radio[1].downlinkFrequency = 2.14GHz
**.radio[1].uplinkFrequency = 1.95GHz
**.radio[1].subcarrierSpacing = 15kHz
**.radio[1].numPrbs = 106
**.radio[1].antenna.antennaModule = "^.^.panel[1]"

[Config Small]
description = "7 sites, a TDD and an FDD carrier on two bands, 210 UEs"
extends = TwoCarriers
*.numSites = 7

[Config SmallBitmap]
description = "As Small, with interleaved RBG allocations in the downlink"
extends = Small
**.gnb[*].sector[*].mac.allocationType = "bitmap"

[Config Large]
description = "19 sites, four carriers on three bands (intra-band CA in the first band), 1140 UEs"
extends = TwoCarriers
sim-time-limit = 2ms
*.numSites = 19
*.numUesPerSector = 20
*.numCarriers = 4
*.numBands = 3
# carrier 2: TDD, 3.6 GHz, 30 kHz, 100 MHz, on the first band, so it shares the panel of carrier 0
**.radio[2].downlinkFrequency = 3.6GHz
**.radio[2].subcarrierSpacing = 30kHz
**.radio[2].numPrbs = 273
# carrier 3: FDD, 2.66 GHz downlink and 2.54 GHz uplink, 15 kHz, 20 MHz, on the third band
**.radio[3].downlinkFrequency = 2.66GHz
**.radio[3].uplinkFrequency = 2.54GHz
**.radio[3].subcarrierSpacing = 15kHz
**.radio[3].numPrbs = 106
**.radio[3].antenna.antennaModule = "^.^.panel[2]"

[Config CarrierSweep]
description = "7 sites and 210 UEs with 1, 2 or 4 TDD carriers of one band, which isolates the cost of the number of radios"
sim-time-limit = 5ms
*.numSites = 7
*.numCarriers = ${numCarriers=1,2,4}
**.radio[*].subcarrierSpacing = 30kHz
**.radio[*].numPrbs = 106
**.radio[0].downlinkFrequency = 3.42GHz
**.radio[1].downlinkFrequency = 3.46GHz
**.radio[2].downlinkFrequency = 3.50GHz
**.radio[3].downlinkFrequency = 3.54GHz
