[General]
network = CoapDtlsNetwork
sim-time-limit = 20s
seed-set = 0
**.arp.typename = "GlobalArp"
**.checksumMode = "declared"
**.fcsMode = "declared"
**.statistic-recording = true

*.server.numApps = 1
*.server.app[0].typename = "CoapDtlsServer"
*.server.app[0].coap.resources = xmldoc("resources.xml")

*.client.numApps = 1
*.client.app[0].typename = "CoapDtlsClient"
*.client.app[0].coap.peerAddress = "server"

[Config PskBasic]
description = "CoAP CON GET over DTLS 1.3 PSK with HelloRetryRequest cookie validation (RFC 7252, RFC 9147)"
*.server.app[0].dtls.profile = "psk"
*.server.app[0].dtls.cookieRequired = true
*.client.app[0].dtls.profile = "psk"
*.client.app[0].coap.confirmable = true
*.client.app[0].coap.requestMethod = "GET"
*.client.app[0].coap.requestUri = "coaps://server:5684/sensors/temp"
*.client.app[0].coap.startTime = 0.5s
*.client.app[0].coap.sendInterval = 2s
*.client.app[0].coap.numRequests = 3

[Config CertificateMutualAuth]
description = "CoAP PUT/GET over DTLS 1.3 certificate profile with mutual client authentication"
*.server.app[0].dtls.profile = "certificate"
*.server.app[0].dtls.clientAuthentication = true
*.client.app[0].dtls.profile = "certificate"
*.client.app[0].coap.confirmable = true
*.client.app[0].coap.requestMethod = "PUT"
*.client.app[0].coap.requestUri = "coaps://server:5684/actuators/log"
*.client.app[0].coap.requestBody = "ready"
*.client.app[0].coap.contentFormat = 0
*.client.app[0].coap.startTime = 0.5s
*.client.app[0].coap.sendInterval = 2s
*.client.app[0].coap.numRequests = 2

[Config LossyObserveBlockwise]
description = "Observe + Block2 download over DTLS 1.3 with periodic updater PUTs on a lossy link"
sim-time-limit = 20s
*.client.ethg$o[0].channel.per = 0.1
*.server.ethg$o[0].channel.per = 0.1
*.client.app[0].coap.preferredBlockSize = 64B
*.server.app[0].coap.preferredBlockSize = 64B
*.client.app[0].coap.confirmable = true
*.client.app[0].coap.requestMethod = "GET"
*.client.app[0].coap.requestUri = "coaps://server:5684/firmware/image"
*.client.app[0].coap.observe = true
*.client.app[0].coap.startTime = 0.5s
*.client.app[0].coap.numRequests = 1

*.updater.numApps = 1
*.updater.app[0].typename = "CoapDtlsClient"
*.updater.app[0].coap.peerAddress = "server"
*.updater.app[0].coap.preferredBlockSize = 64B
*.updater.app[0].coap.useRequestTag = true
*.updater.app[0].coap.confirmable = true
*.updater.app[0].coap.requestMethod = "PUT"
*.updater.app[0].coap.requestUri = "coaps://server:5684/firmware/image"
*.updater.app[0].coap.requestBody = "FIRMWARE-V2-0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF"
*.updater.app[0].coap.contentFormat = 0
*.updater.app[0].coap.startTime = 3s
*.updater.app[0].coap.sendInterval = 4s
*.updater.app[0].coap.numRequests = 2

[Config ProcessingCost]
description = "CoAP CON polling across modeled DTLS record protection delays and KeyUpdate rekeying"
*.server.app[0].dtls.protectOutDelay = 2ms
*.server.app[0].dtls.rekeyAfterRecords = 2
*.client.app[0].dtls.protectOutDelay = 2ms
*.client.app[0].dtls.rekeyAfterRecords = 2
*.client.app[0].coap.confirmable = true
*.client.app[0].coap.requestMethod = "GET"
*.client.app[0].coap.requestUri = "coaps://server:5684/sensors/temp"
*.client.app[0].coap.startTime = 0.5s
*.client.app[0].coap.sendInterval = 1.5s
*.client.app[0].coap.numRequests = 5

[Config Ipv6]
description = "CoAP GET over DTLS 1.3 across autoconfigured IPv6 nodes"
network = CoapDtlsIpv6Network
*.client.app[0].coap.confirmable = true
*.client.app[0].coap.requestMethod = "GET"
*.client.app[0].coap.requestUri = "coaps://server:5684/sensors/temp"
*.client.app[0].coap.startTime = 5s
*.client.app[0].coap.sendInterval = 2s
*.client.app[0].coap.numRequests = 3
