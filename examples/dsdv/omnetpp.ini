[General]
network = DsdvMobileLine
sim-time-limit = 32s
seed-set = 0
cmdenv-express-mode = true
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
*.configurator.addStaticRoutes = false
*.configurator.addDefaultRoutes = false
*.configurator.addSubnetRoutes = false
*.configurator.optimizeRoutes = false
*.configurator.config = xml("<config><interface hosts='host[0]' names='wlan0' address='10.0.0.1' netmask='255.255.255.0'/><interface hosts='host[1]' names='wlan0' address='10.0.0.2' netmask='255.255.255.0'/><interface hosts='host[2]' names='wlan0' address='10.0.0.3' netmask='255.255.255.0'/><interface hosts='host[3]' names='wlan0' address='10.0.0.4' netmask='255.255.255.0'/></config>")
*.host[*].ipv4.routingTable.netmaskRoutes = ""
*.host[*].dsdv.fullDumpInterval = 500ms
*.host[*].dsdv.periodicJitter = 50ms
*.host[*].dsdv.neighborTimeout = 2s
*.host[*].dsdv.routeTimeout = 3s
*.host[*].dsdv.settlingCap = 100ms
*.host[*].dsdv.payloadBudget = 64B
*.host[0].numApps = 1
*.host[0].app[0].typename = "PingApp"
*.host[0].app[0].destAddr = "10.0.0.4"
*.host[0].app[0].startTime = 4s
*.host[0].app[0].sendInterval = 500ms
*.host[0].app[0].printPing = true
*.host[*].mobility.typename = "StationaryMobility"
*.host[*].mobility.initFromDisplayString = false
*.host[*].mobility.updateFromDisplayString = false
*.host[0].mobility.initialX = 100m
*.host[1].mobility.initialX = 200m
*.host[2].mobility.initialX = 300m
*.host[3].mobility.initialX = 400m
*.host[*].mobility.initialY = 100m
*.host[*].mobility.initialZ = 0m
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 600m
**.mobility.constraintAreaMaxY = 600m
**.mobility.constraintAreaMaxZ = 0m
**.wlan[*].typename = "AckingWirelessInterface"
**.wlan[*].radio.typename = "GenericUnitDiskRadio"
**.wlan[*].radio.transmitter.analogModel.communicationRange = 110m
**.wlan[*].radio.transmitter.headerLength = 4b
**.wlan[*].bitrate = 2Mbps
**.wlan[*].mac.headerLength = 20B

[Config Static]
description = "Loss-free line after startup collisions, with only DSDV host routes"

[Config Mobile]
description = "The second node leaves at 8s and returns by 24s"
*.host[1].mobility.typename = "TurtleMobility"
*.host[1].mobility.turtleScript = xml("<movement><set x='200' y='100'/><wait t='8'/><moveto x='200' y='500' t='4'/><wait t='8'/><moveto x='200' y='100' t='4'/><wait t='8'/></movement>")
