[General]
network = MqttSnNetwork
seed-set = 0
sim-time-limit = 8s
*.broker.numApps = 1
*.broker.app[0].typename = "MqttBroker"
*.gateway.numApps = 1
*.gateway.app[0].typename = "MqttSnGateway"
*.gateway.app[0].brokerAddress = "broker"
*.gateway.app[0].advertise = false
*.gateway.app[0].retryInterval = 200ms
*.sensor.numApps = 1
*.sensor.app[0].typename = "MqttSnClient"
*.sensor.app[0].gatewayAddress = "gateway"
*.sensor.app[0].startTime = 0.2s
*.sensor.app[0].retryInterval = 200ms
*.sensor.app[0].workload = xml("<mqttsn><subscribe at='0s' filter='command/+' qos='0'/><publish at='1s' topic='sensor/temperature' payload='32332e35'/><publish at='3s' topic='sensor/temperature' payload='32342e30'/></mqttsn>")
*.observer.numApps = 1
*.observer.app[0].typename = "MqttClient"
*.observer.app[0].clientIdentifier = "observer"
*.observer.app[0].connectAddress = "broker"
*.observer.app[0].workload = xml("<mqtt><subscribe at='0s' filter='sensor/#' qos='0'/><publish at='2s' topic='command/sample' payload='01'/></mqtt>")

[Config Qos1]
description = "Acknowledged MQTT-SN publications and wildcard downlink registration"
*.sensor.app[0].workload = xml("<mqttsn><subscribe at='0s' filter='command/+' qos='1'/><publish at='1s' topic='sensor/temperature' qos='1' payload='32332e35'/><publish at='3s' topic='sensor/temperature' qos='1' payload='32342e30'/></mqttsn>")
*.observer.app[0].workload = xml("<mqtt><subscribe at='0s' filter='sensor/#' qos='1'/><publish at='2s' topic='command/sample' qos='1' payload='01'/></mqtt>")

[Config Qos2]
description = "Independent four-packet handshakes on MQTT-SN and MQTT hops"
*.sensor.app[0].workload = xml("<mqttsn><subscribe at='0s' filter='command/+' qos='2'/><publish at='1s' topic='sensor/temperature' qos='2' payload='32332e35'/></mqttsn>")
*.observer.app[0].workload = xml("<mqtt><subscribe at='0s' filter='sensor/#' qos='2'/><publish at='2s' topic='command/sample' qos='2' payload='01'/></mqtt>")

[Config Qos1Loss]
extends = Qos1
description = "A temporary sensor-link bit-error burst loses a publication after registration; QoS 1 retries it"
*.sensor.app[0].workload = xml("<mqttsn><subscribe at='0s' filter='command/+' qos='1'/><publish at='0.2s' topic='sensor/temperature' qos='1' payload='32332e35'/><publish at='1s' topic='sensor/temperature' qos='1' payload='32342e30'/></mqttsn>")
*.scenarioManager.script = xml("<scenario><at t='1.15'><set-channel-param src-module='sensor' src-gate='ethg$o[0]' par='ber' value='1'/></at><at t='1.35'><set-channel-param src-module='sensor' src-gate='ethg$o[0]' par='ber' value='0'/></at></scenario>")

[Config SleepingSensor]
description = "The gateway buffers a command while the sensor sleeps, then drains it on polling"
*.sensor.app[0].workload = xml("<mqttsn><subscribe at='0s' filter='command/+' qos='1'/><sleep at='0.5s' duration='5s'/><poll at='3s'/></mqttsn>")
*.observer.app[0].workload = xml("<mqtt><publish at='2s' topic='command/sample' qos='1' payload='01'/></mqtt>")

[Config Connectionless]
description = "QoS -1 uses a predefined topic without sensor CONNECT or registration"
*.sensor.app[0].connectionless = true
*.sensor.app[0].predefinedTopics = xml("<topics><topic id='5' name='sensor/temperature'/></topics>")
*.gateway.app[0].predefinedTopics = xml("<topics><topic id='5' name='sensor/temperature'/></topics>")
*.sensor.app[0].workload = xml("<mqttsn><publish at='1s' topicKind='1' topicId='5' qos='-1' payload='32332e35'/><publish at='3s' topicKind='1' topicId='5' qos='-1' payload='32342e30'/></mqttsn>")
*.observer.app[0].workload = xml("<mqtt><subscribe at='0s' filter='sensor/#'/></mqtt>")

[Config Discovery]
extends = Qos1
description = "Local IPv4 broadcast discovery before connection setup"
*.sensor.app[0].gatewayAddress = ""
*.sensor.app[0].searchDelay = 100ms
*.gateway.app[0].advertise = true
*.gateway.app[0].advertisementInterval = 1s

[Config Wireless]
extends = Qos1
description = "The same applications over modeled Wi-Fi and IP, with stationary nodes"
network = MqttSnWirelessNetwork
**.mobility.typename = "StationaryMobility"
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 100m
**.constraintAreaMaxY = 100m
**.constraintAreaMaxZ = 0m
**.wlan[*].bitrate = 2Mbps
**.wlan[*].radio.transmitter.power = 2mW
