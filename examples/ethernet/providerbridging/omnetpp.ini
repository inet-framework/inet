[General]
network = ProviderBridgingExample
abstract = true

**.fcsMode = "computed"
**.checksumMode = "computed"

*.*.llc.typename = ""
*.*.ethernet.typename = "EthernetLayer"
*.*.eth[*].typename = "LayeredEthernetInterface"
*.*.eth[*].bitrate = 100Mbps

# The hosts send and receive untagged frames; they have no 802.1Q layer. The
# hosts of customer B use the MAC addresses of customer A's hosts at the other
# site, so a provider that mixed the customers would deliver to the wrong site.
*.hostA1.eth[0].address = "02-00-00-00-0a-01"
*.hostA3.eth[0].address = "02-00-00-00-0a-03"
*.hostB1.eth[0].address = "02-00-00-00-0a-03"
*.hostB2.eth[0].address = "02-00-00-00-0a-01"

# Each C-VLAN is an IP subnet of its own.
*.configurator.config = xmldoc("addresses.xml")

*.host*.numApps = 1
*.host*.app[0].typename = "PingApp"
*.host*.app[0].startTime = 1ms
*.host*.app[0].sendInterval = 10ms
*.host*.app[0].count = 5
*.hostA1.app[0].destAddr = "hostA3"
*.hostA2.app[0].destAddr = "hostA4"
*.hostA3.app[0].destAddr = "hostA5"
*.hostA4.app[0].destAddr = "hostA2"
*.hostA5.app[0].destAddr = "hostA1"
*.hostB1.app[0].destAddr = "hostB2"
*.hostB2.app[0].destAddr = "hostB1"

# Every bridge is VLAN-aware: it learns and forwards per VLAN, in the VLAN space
# of its 802.1Q layer. The filters check the VLAN id as it is on the wire.
*.cb*.ieee8021q.typename = "Ieee8021qProtocol"
*.peb*.ieee8021q.typename = "Ieee8021qProtocol"
*.pb.ieee8021q.typename = "Ieee8021qProtocol"
*.cb*.bridging.typename = "BridgingLayer"
*.peb*.bridging.typename = "BridgingLayer"
*.pb.bridging.typename = "BridgingLayer"
*.cb*.bridging.vlanPolicy.typename = "VlanPolicyLayer"
*.peb*.bridging.vlanPolicy.typename = "VlanPolicyLayer"
*.pb.bridging.vlanPolicy.typename = "VlanPolicyLayer"

# A forwarded PCP would keep the tag on a port that sends the VLAN untagged,
# as a priority tag (VLAN id 0).
*.cb*.bridging.directionReverser.reverser.forwardPcp = false
*.peb*.bridging.directionReverser.reverser.forwardPcp = false
*.pb.bridging.directionReverser.reverser.forwardPcp = false

# The customer network port of peb1 toward customer A (eth0) carries C-tagged
# frames, its provider network port (eth2) S-tagged frames over C-tagged ones.
*.peb1.numPcapRecorders = 2
*.peb1.pcapRecorder[0].moduleNamePatterns = "eth[0]"
*.peb1.pcapRecorder[0].pcapFile = "${resultdir}/${configname}-#${runnumber}-peb1_eth0.pcap"
*.peb1.pcapRecorder[1].moduleNamePatterns = "eth[2]"
*.peb1.pcapRecorder[1].pcapFile = "${resultdir}/${configname}-#${runnumber}-peb1_eth2.pcap"

[Config PortBased]
sim-time-limit = 100ms
description = "port-based service interface: each customer port of the provider is in the S-VLAN of the customer"

# The customer bridges are C-VLAN bridges. The access ports of the hosts accept
# untagged frames only and classify them into the VLAN of the port; the uplink
# is a trunk that carries the customer's VLANs C-tagged.
*.cbA*.bridging.vlanPolicy.inboundMapper.typename = "VlanIndMapper"
*.cbB*.bridging.vlanPolicy.inboundMapper.typename = "VlanIndMapper"

*.cbA1.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 10}, "eth1" : {"-1" : 20}}
*.cbA1.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [10, 20]}
*.cbA1.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [10, 20]}
*.cbA1.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"10" : -1}, "eth1" : {"20" : -1}}

*.cbA2.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 10}, "eth1" : {"-1" : 20}}
*.cbA2.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [10, 20]}
*.cbA2.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [10, 20]}
*.cbA2.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"10" : -1}, "eth1" : {"20" : -1}}

# Site 3 of customer A has C-VLAN 10 only; its uplink drops the frames of
# C-VLAN 20 that the provider delivers to every site of the customer.
*.cbA3.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 10}}
*.cbA3.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [10]}
*.cbA3.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [10]}
*.cbA3.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"10" : -1}}

*.cbB*.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 10}}
*.cbB*.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [10]}
*.cbB*.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [10]}
*.cbB*.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"10" : -1}}

# The provider bridges are S-VLAN bridges: their 802.1Q layer inserts and
# removes S-tags, and leaves the C-tags of the customers in the payload.
*.peb*.ieee8021q.vlanTagType = "s"
*.pb.ieee8021q.vlanTagType = "s"
*.peb*.bridging.vlanPolicy.outboundMapper.protocol = "ieee8021qstag"
*.pb.bridging.vlanPolicy.outboundMapper.protocol = "ieee8021qstag"

# A customer network port of a provider edge bridge accepts frames without an
# S-tag, puts all of them into the S-VLAN of the customer, and removes the
# S-tag when it sends. The provider network port carries the S-VLANs S-tagged.
*.peb*.bridging.vlanPolicy.inboundMapper.typename = "VlanIndMapper"

*.peb1.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 100}, "eth1" : {"-1" : 200}}
*.peb1.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [100, 200]}
*.peb1.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [100, 200]}
*.peb1.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"100" : -1}, "eth1" : {"200" : -1}}

*.peb2.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 100}, "eth1" : {"-1" : 200}}
*.peb2.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [100, 200]}
*.peb2.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [100, 200]}
*.peb2.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"100" : -1}, "eth1" : {"200" : -1}}

*.peb3.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 100}}
*.peb3.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [100]}
*.peb3.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [100]}
*.peb3.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"100" : -1}}

# The provider core bridge relays by S-VLAN only. Only customer A has a site
# behind peb3, so S-VLAN 200 does not extend there.
*.pb.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [100, 200], "eth1" : [100, 200], "eth2" : [100]}
*.pb.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [100, 200], "eth1" : [100, 200], "eth2" : [100]}
