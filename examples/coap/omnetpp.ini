[General]
network = CoapNetwork
sim-time-limit = 20s
seed-set = 0
**.arp.typename = "GlobalArp"
**.statistic-recording = true

*.server.numApps = 1
*.server.app[0].typename = "CoapServer"
*.server.app[0].localPort = 5683
*.server.app[0].resources = xmldoc("resources.xml")

*.client.numApps = 1
*.client.app[0].typename = "CoapClient"
*.client.app[0].localPort = 16000
*.client.app[0].peerAddress = "server"
*.client.app[0].peerPort = 5683

[Config NonConfirmable]
description = "Non-confirmable periodic GET polling (RFC 7252)"
*.client.app[0].confirmable = false
*.client.app[0].requestMethod = "GET"
*.client.app[0].requestUri = "/sensors/temp"
*.client.app[0].startTime = 1s
*.client.app[0].sendInterval = 2s
*.client.app[0].numRequests = 5

[Config ConfirmableLoss]
description = "Confirmable GET recovery over a lossy link (RFC 7252)"
sim-time-limit = 40s
*.client.ethg$o[0].channel.per = 0.25
*.server.ethg$o[0].channel.per = 0.25
*.client.app[0].confirmable = true
*.client.app[0].requestMethod = "GET"
*.client.app[0].requestUri = "/sensors/temp"
*.client.app[0].startTime = 1s
*.client.app[0].sendInterval = 6s
*.client.app[0].numRequests = 5

[Config SeparateResponse]
description = "Confirmable GET answered via Empty ACK and delayed CON response"
*.server.app[0].responseDelay = 0.5s
*.client.app[0].confirmable = true
*.client.app[0].requestMethod = "GET"
*.client.app[0].requestUri = "/sensors/temp"
*.client.app[0].startTime = 1s
*.client.app[0].numRequests = 2
*.client.app[0].sendInterval = 3s

[Config ResourceDiscovery]
description = "CoRE Link Format discovery under /.well-known/core with rt filter (RFC 6690)"
*.client.app[0].confirmable = true
*.client.app[0].requestMethod = "GET"
*.client.app[0].requestUri = "/.well-known/core?rt=temperature"
*.client.app[0].accept = 40
*.client.app[0].startTime = 1s
*.client.app[0].numRequests = 1

[Config Observe]
description = "Observe subscription receiving server updates pushed by updater (RFC 7641)"
sim-time-limit = 15s
*.client.app[0].confirmable = true
*.client.app[0].requestMethod = "GET"
*.client.app[0].requestUri = "/sensors/temp"
*.client.app[0].observe = true
*.client.app[0].startTime = 1s
*.client.app[0].numRequests = 1

*.updater.numApps = 1
*.updater.app[0].typename = "CoapClient"
*.updater.app[0].localPort = 16001
*.updater.app[0].peerAddress = "server"
*.updater.app[0].peerPort = 5683
*.updater.app[0].confirmable = true
*.updater.app[0].requestMethod = "PUT"
*.updater.app[0].requestUri = "/sensors/temp"
*.updater.app[0].requestBody = "23C"
*.updater.app[0].contentFormat = 0
*.updater.app[0].startTime = 3s
*.updater.app[0].sendInterval = 3s
*.updater.app[0].numRequests = 3

[Config Block1Upload]
description = "Block1 segmented PUT upload with Request-Tag enabled (RFC 7959, RFC 9175)"
*.client.app[0].preferredBlockSize = 64B
*.server.app[0].preferredBlockSize = 64B
*.client.app[0].confirmable = true
*.client.app[0].requestMethod = "PUT"
*.client.app[0].requestUri = "/firmware/image"
*.client.app[0].useRequestTag = true
*.client.app[0].contentFormat = 0
*.client.app[0].requestBody = "FW-UPDATE-PAYLOAD-0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF"
*.client.app[0].startTime = 1s
*.client.app[0].numRequests = 1

[Config Block2Download]
description = "Block2 paginated GET download of a multi-block representation (RFC 7959)"
*.client.app[0].preferredBlockSize = 64B
*.server.app[0].preferredBlockSize = 64B
*.client.app[0].confirmable = true
*.client.app[0].requestMethod = "GET"
*.client.app[0].requestUri = "/large/manual"
*.client.app[0].startTime = 1s
*.client.app[0].numRequests = 1

[Config ObserveBlockwise]
description = "Observe notifications on a large resource retrieved via Block2 follow-up GETs"
sim-time-limit = 15s
*.client.app[0].preferredBlockSize = 64B
*.server.app[0].preferredBlockSize = 64B
*.client.app[0].confirmable = true
*.client.app[0].requestMethod = "GET"
*.client.app[0].requestUri = "/firmware/image"
*.client.app[0].observe = true
*.client.app[0].startTime = 1s
*.client.app[0].numRequests = 1

*.updater.numApps = 1
*.updater.app[0].typename = "CoapClient"
*.updater.app[0].localPort = 16001
*.updater.app[0].peerAddress = "server"
*.updater.app[0].peerPort = 5683
*.updater.app[0].preferredBlockSize = 64B
*.updater.app[0].confirmable = true
*.updater.app[0].requestMethod = "PUT"
*.updater.app[0].requestUri = "/firmware/image"
*.updater.app[0].useRequestTag = true
*.updater.app[0].contentFormat = 0
*.updater.app[0].requestBody = "FIRMWARE-V2-0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF"
*.updater.app[0].startTime = 4s
*.updater.app[0].numRequests = 1

[Config Ipv6]
description = "Confirmable GET and PUT over IPv6 (CoapIpv6Network)"
network = CoapIpv6Network
*.client.app[0].confirmable = true
*.client.app[0].requestMethod = "GET"
*.client.app[0].requestUri = "/sensors/temp"
*.client.app[0].startTime = 3s
*.client.app[0].sendInterval = 2s
*.client.app[0].numRequests = 3
