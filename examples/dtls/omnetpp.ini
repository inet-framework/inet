[General]
sim-time-limit = 10s
seed-set = 0
cmdenv-express-mode = true
record-eventlog = false
**.scalar-recording = true
**.vector-recording = true
**.checksumMode = "declared"
**.fcsMode = "declared"
*.client.numApps = 1
*.server.numApps = 1
*.client.app[0].typename = "DtlsApp"
*.server.app[0].typename = "DtlsApp"
*.client.app[0].dtls.localPort = 44000
*.server.app[0].dtls.localPort = 4433
*.client.app[0].io.destAddress = "server"
*.client.app[0].io.destPort = 4433
*.server.app[0].server = true
*.client.app[0].source.initialProductionOffset = 100ms
*.client.app[0].source.productionInterval = 500ms
*.client.app[0].source.packetLength = 128B

[Config Basic]
network = DtlsNetwork
description = "External-PSK profile, cookie validation and periodic application datagrams"

[Config Certificate]
extends = Basic
description = "Certificate-sized modeled handshake without actual certificate validation"
**.app[0].dtls.profile = "certificate"

[Config Fragmentation]
extends = Certificate
description = "A large certificate requires DTLS handshake fragments"
**.app[0].dtls.certificateBytes = 8192B
**.app[0].dtls.udpPayloadLimit = 500B

[Config LossyHandshake]
extends = Fragmentation
description = "Reproducible link errors exercise handshake recovery and application loss"
sim-time-limit = 30s
*.packetErrorRate = 0.15

[Config ProcessingCost]
extends = Basic
description = "Independent input/output service queues add modeled cryptographic cost"
**.app[0].dtls.protectOutDelay = 2ms
**.app[0].dtls.protectInDelay = 1ms
**.app[0].dtls.handshakeOutDelay = 3ms
**.app[0].dtls.handshakeInDelay = 2ms
*.client.app[0].source.productionInterval = 1ms

[Config Ipv6]
extends = Basic
description = "The same DTLS application over the IPv6 UDP stack"
*.client.typename = "StandardHost6"
*.server.typename = "StandardHost6"
*.configurator.typename = "Ipv6FlatNetworkConfigurator"

[Config Reconnect]
extends = Basic
network = DtlsScenarioNetwork
description = "Close and reconnect using a cached session ticket"
**.app[0].dtls.resumptionEnabled = true
*.client.app[0].io.resumeSession = true
*.scenarioManager.script = xml("<scenario><close-dtls t='2s' module='client.app[0].io'/><open-dtls t='2.5s' module='client.app[0].io'/></scenario>")

[Config EarlyData]
extends = Reconnect
description = "Explicit 32-byte early datagram on a ticket reconnect; no automatic replay"
**.app[0].dtls.earlyDataEnabled = true
*.server.app[0].dtls.cookieRequired = false
*.server.app[0].io.acceptEarlyData = true
*.scenarioManager.script = xml("<scenario><close-dtls t='2s' module='client.app[0].io'/><at t='2.5s'><open-dtls module='client.app[0].io' early='true'/><send-early-dtls module='client.app[0].io'/></at></scenario>")

[Config Migration]
extends = Basic
network = DtlsScenarioNetwork
description = "Validate an actual client UDP port rebind while keeping one association"
**.app[0].dtls.connectionIdEnabled = true
**.app[0].dtls.heartbeatEnabled = true
**.app[0].dtls.migrationEnabled = true
*.scenarioManager.script = xml("<scenario><request-dtls-cid t='1s' module='client.app[0].io'/><rebind-dtls t='2s' module='client.app[0].io' port='44001'/></scenario>")

[Config DeferredAuthentication]
extends = Certificate
network = DtlsScenarioNetwork
description = "A server requests a modeled client certificate after establishment"
**.app[0].dtls.postHandshakeAuthEnabled = true
*.scenarioManager.script = xml("<scenario><authenticate-dtls t='2s' module='server.app[0].io'/></scenario>")

[Config AlgorithmCost]
extends = Certificate
description = "AES-256/SHA-384 with P-256 and explicit directional modeled costs"
**.app[0].dtls.cipherSuites = "TLS_AES_256_GCM_SHA384"
**.app[0].dtls.keyExchangeGroups = "secp256r1"
**.app[0].dtls.aes256GcmProtectOutDelay = 2ms
**.app[0].dtls.aes256GcmProtectInDelay = 1ms

[Config PathMtu]
extends = Basic
network = DtlsRoutedNetwork
description = "Discover an asymmetric routed 828-byte IP bottleneck"
**.ipv4.arp.typename = "GlobalArp"
**.app[0].dtls.connectionIdEnabled = true
**.app[0].dtls.heartbeatEnabled = true
**.app[0].dtls.pathMtuDiscoveryEnabled = true
*.router.eth[1].mac.mtu = 828B
*.router.ipv4.icmp.quoteLength = 96B

[Config Legacy]
extends = Basic
description = "Opt-in DTLS 1.2 full PSK/GCM exchange with legacy records"
**.app[0].dtls.versions = "1.2"

[Config MixedVersions]
extends = Legacy
description = "A dual-version client selects 1.2 against a legacy-only server"
*.client.app[0].dtls.versions = "1.3 1.2"

[Config LegacyReconnect]
extends = Reconnect
description = "Abbreviated DTLS 1.2 ticket handshake on reconnect"
**.app[0].dtls.versions = "1.2"

[Config LegacyMigration]
extends = Migration
description = "Validate a legacy static-CID port rebind without requesting spare IDs"
**.app[0].dtls.versions = "1.2"
*.scenarioManager.script = xml("<scenario><rebind-dtls t='2s' module='client.app[0].io' port='44001'/></scenario>")
