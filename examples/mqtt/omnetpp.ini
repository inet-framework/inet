[General]
network = MqttNetwork
seed-set = 0
sim-time-limit = 8s
*.broker.numApps = 1
*.broker.app[0].typename = "MqttBroker"
*.publisher.numApps = 1
*.publisher.app[0].typename = "MqttClient"
*.publisher.app[0].clientIdentifier = "publisher"
*.publisher.app[0].connectAddress = "broker"
*.publisher.app[0].startTime = 0.1s
*.publisher.app[0].workload = xml("<mqtt><publish at='1s' topic='factory/line1/temperature' payload='32332e35'/><publish at='3s' topic='factory/line1/temperature' payload='32342e30'/><publish at='5s' topic='factory/line1/temperature' payload='32342e35'/></mqtt>")
*.subscriber.numApps = 1
*.subscriber.app[0].typename = "MqttClient"
*.subscriber.app[0].clientIdentifier = "subscriber"
*.subscriber.app[0].connectAddress = "broker"
*.subscriber.app[0].startTime = 0.1s
*.subscriber.app[0].workload = xml("<mqtt><subscribe at='0s' filter='factory/+/temperature'/></mqtt>")

[Config Qos1]
description = "Acknowledged publications on both delivery legs"
*.publisher.app[0].workload = xml("<mqtt><publish at='1s' topic='factory/line1/temperature' qos='1' payload='32332e35'/><publish at='3s' topic='factory/line1/temperature' qos='1' payload='32342e30'/></mqtt>")
*.subscriber.app[0].workload = xml("<mqtt><subscribe at='0s' filter='factory/+/temperature' qos='1'/></mqtt>")

[Config Qos2]
description = "Four-packet delivery handshakes on both legs"
*.publisher.app[0].workload = xml("<mqtt><publish at='1s' topic='factory/line1/temperature' qos='2' payload='32332e35'/></mqtt>")
*.subscriber.app[0].workload = xml("<mqtt><subscribe at='0s' filter='factory/+/temperature' qos='2'/></mqtt>")

[Config Retained]
description = "A late subscriber receives the broker's retained value"
*.publisher.app[0].workload = xml("<mqtt><publish at='0.1s' topic='factory/line1/temperature' qos='1' retain='true' payload='32332e35'/></mqtt>")
*.subscriber.app[0].startTime = 2s
*.subscriber.app[0].workload = xml("<mqtt><subscribe at='0s' filter='factory/+/temperature' qos='1'/></mqtt>")

[Config PersistentReconnect]
extends = Qos1
description = "An offline persistent subscriber receives queued publications after restart"
*.subscriber.app[0].cleanSession = false
*.scenarioManager.script = xml("<scenario><at t='2'><shutdown module='subscriber.app[0]'/></at><at t='4'><startup module='subscriber.app[0]'/></at></scenario>")
