[General]
network = HtAmpdu
sim-time-limit = 1.5s
seed-set = 0

*.source.numApps = 1
*.source.app[0].typename = "UdpBasicApp"
*.source.app[0].destAddresses = "destination"
*.source.app[0].destPort = 1000
*.source.app[0].messageLength = 1200B
*.source.app[0].startTime = 1s
*.source.app[0].stopTime = 1.03s
*.source.app[0].sendInterval = 30us
*.destination.numApps = 1
*.destination.app[0].typename = "UdpSink"
*.destination.app[0].localPort = 1000
*.source.ipv4.arp.typename = "GlobalArp"
*.destination.ipv4.arp.typename = "GlobalArp"

**.wlan[*].opMode = "n(mixed-2.4Ghz)"
**.wlan[*].bitrate = 6Mbps
**.wlan[*].classifier.typename = "QosClassifier"
**.wlan[*].mac.qosStation = true
**.wlan[*].mac.fcsMode = "computed"
**.checksumMode = "computed"
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].mac.hcf.blockAckVariant = "compressed"
**.wlan[*].mac.hcf.rateControl.typename = ""
**.wlan[*].mac.hcf.rateSelection.dataFrameBitrate = 65Mbps
**.wlan[*].mac.hcf.rateSelection.controlFrameBitrate = 6Mbps
**.wlan[*].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz
**.wlan[*].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
**.originatorMacDataService.mpduAggregationPolicy.typename = "HtMpduAggregationPolicy"
**.originatorMacDataService.msduAggregationPolicy.typename = ""
**.originatorAckPolicy.maxBlockAckPolicyFrameLength = 10000B
**.txopProcedure.txopLimit = 4ms
**.txopProcedure.protectionMechanism = "multiple"
**.rtsPolicy.rtsThreshold = 2346B
**.bandName = "2.4 GHz"

**.mobility.initFromDisplayString = false
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 100m
**.mobility.constraintAreaMaxY = 100m
**.mobility.constraintAreaMaxZ = 0m
*.source.mobility.initialX = 0m
*.ap.mobility.initialX = 5m
*.destination.mobility.initialX = 10m
**.mobility.initialY = 0m
**.mobility.initialZ = 0m

[Config ZeroTxop]
description = "One aggregate DATA PPDU per channel grant"
**.txopProcedure.txopLimit = 0s

[Config Dimensional]
description = "HT aggregates through the dimensional PHY"
*.radioMedium.typename = "Ieee80211DimensionalRadioMedium"
**.wlan[*].radio.typename = "Ieee80211DimensionalRadio"
