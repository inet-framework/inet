[General]
abstract = true
network = inet.examples.wireless.mesh.MeshNetwork
sim-time-limit = 4s
seed-set = 0
result-dir = results/${configname}
**.cmdenv-log-level = warn
*.configurator.config = xmldoc("addresses.xml")
*.configurator.addStaticRoutes = false
*.configurator.addManualRoutes = true
*.configurator.assignDisjunctSubnetAddresses = false
*.configurator.dumpAddresses = true
*.configurator.dumpRoutes = true
*.configurator.dumpConfig = "${resultdir}/addresses.xml"
*.station[*].numWlanInterfaces = 1
*.station[*].hasIpv6 = false
*.station[*].forwarding = false
*.station[*].ipv4.arp.typename = "Arp"
*.station[*].ipv4.arp.proxyArpInterfaces = ""
*.station[*].wlan[0].typename = "Ieee80211MeshInterface"
*.station[*].wlan[0].mgmt.autoPeer = true
*.station[*].wlan[0].mac.fcsMode = "computed"
**.checksumMode = "computed"
*.station[*].wlan[0].radio.transmitter.power = 1mW
*.station[*].wlan[0].radio.receiver.sensitivity = -85dBm
*.station[*].wlan[0].radio.receiver.energyDetection = -85dBm
*.station[*].wlan[0].radio.receiver.snirThreshold = 4dB
*.station[*].mobility.typename = "StationaryMobility"
*.station[*].mobility.initFromDisplayString = false
*.station[*].mobility.initialZ = 0m
*.station[*].mobility.constraintAreaMinX = -1m
*.station[*].mobility.constraintAreaMaxX = 200m
*.station[*].mobility.constraintAreaMinY = 0m
*.station[*].mobility.constraintAreaMaxY = 200m
*.station[*].mobility.constraintAreaMinZ = 0m
*.station[*].mobility.constraintAreaMaxZ = 0m
*.station[0].wlan[0].address = "0A-AA-00-00-00-01"
*.station[1].wlan[0].address = "0A-AA-00-00-00-02"
*.station[2].wlan[0].address = "0A-AA-00-00-00-03"
*.station[0].wlan[0].mgmt.initialTsf = 0ms
*.station[1].wlan[0].mgmt.initialTsf = 25.6ms
*.station[2].wlan[0].mgmt.initialTsf = 51.2ms
*.station[0].numApps = 1
*.station[2].numApps = 1
*.station[*].numApps = 0
*.station[0].app[0].typename = "UdpBasicApp"
*.station[0].app[0].destAddresses = "station[2]"
*.station[0].app[0].destPort = 4000
*.station[0].app[0].messageLength = 100B
*.station[0].app[0].sendInterval = 200ms
*.station[0].app[0].startTime = 1s
*.station[0].app[0].stopTime = 3s
*.station[2].app[0].typename = "UdpSink"
*.station[2].app[0].localPort = 4000
*.station[*].numPcapRecorders = 0
*.txCapture[*].moduleNamePatterns = "station[" + string(index) + "]"
*.rxCapture[*].moduleNamePatterns = "station[" + string(index) + "]"
*.txCapture[*].sendingSignalNames = "transmissionEnded"
*.txCapture[*].receivingSignalNames = ""
*.rxCapture[*].sendingSignalNames = ""
*.rxCapture[*].receivingSignalNames = "receptionEnded"
*.txCapture[*].pcapFile = "${resultdir}/tx-" + string(index) + ".pcap"
*.rxCapture[*].pcapFile = "${resultdir}/rx-" + string(index) + ".pcap"
*.txCapture[*].dumpProtocols = "ieee80211mac"
*.rxCapture[*].dumpProtocols = "ieee80211mac"
*.txCapture[*].helpers = "inet::physicallayer::Ieee80211RadiotapPcapRecorderHelper"
*.rxCapture[*].helpers = "inet::physicallayer::Ieee80211RadiotapPcapRecorderHelper"
*.txCapture[*].fileFormat = "pcap"
*.rxCapture[*].fileFormat = "pcap"
*.txCapture[*].timePrecision = 9
*.rxCapture[*].timePrecision = 9
*.rxCapture[*].dumpBadFrames = false

[Config LineBase]
abstract = true
*.station[0].mobility.initialX = 0m
*.station[1].mobility.initialX = 75m
*.station[2].mobility.initialX = 150m
*.station[*].mobility.initialY = 20m

[Config LineOfdm]
extends = LineBase
description = "Native L2 relay with dynamic ARP and IP forwarding disabled"

[Config DiamondBase]
abstract = true
*.numStations = 4
*.configurator.config = xmldoc("diamond-addresses.xml")
*.station[3].wlan[0].address = "0A-AA-00-00-00-04"
*.station[3].wlan[0].mgmt.initialTsf = 76.8ms
*.station[0].mobility.initialX = 0m
*.station[0].mobility.initialY = 100m
*.station[1].mobility.initialX = 60m
*.station[1].mobility.initialY = 130m
*.station[2].mobility.initialX = 60m
*.station[2].mobility.initialY = 70m
*.station[3].mobility.initialX = 120m
*.station[3].mobility.initialY = 100m
*.station[0].app[0].destAddresses = "station[3]"
*.station[2].numApps = 0
*.station[3].numApps = 1
*.station[3].app[0].typename = "UdpSink"
*.station[3].app[0].localPort = 4000
*.station[0].wlan[0].mac.hcf.rateSelection.dataFrameBitratePerReceiver = {"MeshNetwork.station[1].wlan[0]": 6Mbps, "MeshNetwork.station[2].wlan[0]": 24Mbps}
*.station[3].wlan[0].mac.hcf.rateSelection.dataFrameBitratePerReceiver = {"MeshNetwork.station[1].wlan[0]": 6Mbps, "MeshNetwork.station[2].wlan[0]": 24Mbps}
*.station[1].wlan[0].mac.hcf.rateSelection.dataFrameBitrate = 6Mbps
*.station[2].wlan[0].mac.hcf.rateSelection.dataFrameBitrate = 24Mbps
*.station[2].wlan[0].mac.hcf.rateSelection.dataFrameBitratePerReceiver = {"MeshNetwork.station[1].wlan[0]": 6Mbps}

[Config DiamondOfdm]
extends = DiamondBase
description = "Two equal-hop alternatives with different directional airtime costs"

[Config FailureAlternate]
extends = DiamondOfdm
sim-time-limit = 10s
# Keep coincidence diagnostics while the medium models actual interference.
*.radioMedium.sameTransmissionStartTimeCheck = "warning"
*.station[0].app[0].startTime = 2s
*.station[0].app[0].stopTime = 8s
*.station[0].app[0].sendInterval = 100ms
*.station[2].mobility.typename = "TurtleMobility"
*.station[2].mobility.turtleScript = xmldoc("move-fast-relay.xml")

[Config RootPreq]
extends = LineBase
sim-time-limit = 6s
description = "Proactive PREQ root, with traffic toward the root"
*.station[0].wlan[0].pathSelection.rootMode = 3
*.station[0].wlan[0].pathSelection.rootInterval = 409.6ms
*.station[0].wlan[0].pathSelection.confirmationInterval = 102.4ms
*.station[0].app[0].typename = "UdpSink"
*.station[0].app[0].localPort = 4000
*.station[0].app[0].startTime = 0s
*.station[0].app[0].stopTime = -1s
*.station[2].app[0].typename = "UdpBasicApp"
*.station[2].app[0].destAddresses = "station[0]"
*.station[2].app[0].destPort = 4000
*.station[2].app[0].messageLength = 100B
*.station[2].app[0].sendInterval = 200ms
*.station[2].app[0].startTime = 2.5s
*.station[2].app[0].stopTime = 4.5s

[Config RootRann]
extends = RootPreq
description = "RANN root with unicast path confirmation"
*.station[0].wlan[0].pathSelection.rootMode = 4
*.station[0].wlan[0].pathSelection.rannInterval = 409.6ms

[Config NestedBase]
extends = LineBase
abstract = true
sim-time-limit = 6s
*.radioMedium.typename = "Ieee80211DimensionalRadioMedium"
*.station[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.station[*].wlan[0].phyProfile = "ht"
*.station[*].wlan[0].mac.hcf.rateSelection.dataFramePhyFamily = "ht"
*.station[*].wlan[0].mac.hcf.rateSelection.dataFrameMcs = 7
*.station[*].wlan[0].mac.hcf.rateSelection.dataFrameGuardInterval = "long"
*.station[*].wlan[0].mac.hcf.rateSelection.dataFrameBandwidth = 20MHz
*.station[*].wlan[0].mac.hcf.rateSelection.dataFrameNumSpatialStreams = 1
*.station[*].wlan[0].mac.hcf.rateSelection.dataFrameBitrate = -1bps
*.station[*].wlan[0].mac.hcf.isBlockAckSupported = true
*.station[*].wlan[0].mac.hcf.blockAckVariant = "compressed"
*.station[*].wlan[0].mac.hcf.originatorMacDataService.msduAggregationPolicy.typename = "BasicMsduAggregationPolicy"
*.station[*].wlan[0].mac.hcf.originatorMacDataService.msduAggregationPolicy.maxAMsduSize = 400
*.station[*].wlan[0].mac.hcf.originatorMacDataService.msduAggregationPolicy.subframeNumThreshold = 2
*.station[*].wlan[0].mac.hcf.originatorMacDataService.mpduAggregationPolicy.typename = "BasicMpduAggregationPolicy"
*.station[*].wlan[0].mac.hcf.originatorMacDataService.mpduAggregationPolicy.maxMpduCount = 3
*.station[0].numApps = 6
*.station[0].app[*].typename = "UdpBasicApp"
*.station[0].app[*].destAddresses = "station[2]"
*.station[0].app[*].destPort = 4000
*.station[0].app[*].messageLength = 100B
*.station[0].app[*].sendInterval = 1ms
*.station[0].app[*].startTime = 1.02s
*.station[0].app[*].stopTime = 1.024s

[Config HtNested]
extends = NestedBase
description = "Native HT A-MPDU containing native A-MSDUs, default metric 2"

[Config VhtNested]
extends = NestedBase
description = "Native VHT nested aggregation, default metric 2"
*.station[*].wlan[0].phyProfile = "vht"
*.station[*].wlan[0].mac.hcf.rateSelection.dataFramePhyFamily = "vht"

[Config HtNestedMetric1]
extends = HtNested
*.station[*].wlan[0].pathSelectionMetricId = 1

[Config VhtNestedMetric1]
extends = VhtNested
*.station[*].wlan[0].pathSelectionMetricId = 1

[Config LightRelay]
extends = LineBase
sim-time-limit = 6s
description = "LIGHT relay and endpoints, controlled through ScenarioManager"
*.station[*].wlan[0].powerSave = true
*.scenarioManager.script = xmldoc("light-sleep.xml")
*.station[*].wlan[0].mac.hcf.edca.edcaf[*].msduLifetime = 3s
*.station[*].wlan[0].pathSelection.netDiameterTraversalTime = 2.048s
*.station[0].app[0].startTime = 1.02s
*.station[0].app[0].stopTime = 3.02s

[Config DeepRelay]
extends = LightRelay
description = "DEEP relay with ACTIVE endpoints and a shared reverse-control rendezvous"
*.scenarioManager.script = xmldoc("deep-sleep.xml")
# Cold ARP is queued during sleep before the selected reference rendezvous.
*.station[0].app[0].startTime = 1.10s
*.station[0].app[0].stopTime = 3.10s
*.station[2].wlan[0].mgmt.initialTsf = 20.48ms

[Config DtimGroup]
extends = LightRelay
description = "DTIM group delivery, including cold ARP and a broadcast UDP message"
*.station[*].wlan[0].mgmt.dtimPeriod = 2
*.station[0].ipv4.ip.limitedBroadcast = true
*.station[0].numApps = 2
*.station[0].app[1].typename = "UdpBasicApp"
*.station[0].app[1].destAddresses = "10.0.0.255"
*.station[0].app[1].destPort = 4001
*.station[0].app[1].messageLength = 100B
*.station[0].app[1].sendInterval = 1s
*.station[0].app[1].startTime = 1.0201s
*.station[0].app[1].stopTime = 1.0202s
*.station[1].numApps = 1
*.station[1].app[0].typename = "UdpSink"
*.station[1].app[0].localPort = 4001
*.station[1].app[0].receiveBroadcast = true
*.station[2].numApps = 2
*.station[2].app[1].typename = "UdpSink"
*.station[2].app[1].localPort = 4001
*.station[2].app[1].receiveBroadcast = true

[Config SleepingHtNested]
extends = HtNested
description = "LIGHT power save combined with native HT nested aggregation"
*.station[*].wlan[0].powerSave = true
*.station[*].wlan[0].mac.hcf.edca.edcaf[*].msduLifetime = 3s
*.station[*].wlan[0].pathSelection.netDiameterTraversalTime = 2.048s
*.scenarioManager.script = xmldoc("light-sleep.xml")

[Config SleepingVhtNested]
extends = VhtNested
description = "LIGHT power save combined with native VHT nested aggregation"
*.station[*].wlan[0].powerSave = true
*.station[*].wlan[0].mac.hcf.edca.edcaf[*].msduLifetime = 3s
*.station[*].wlan[0].pathSelection.netDiameterTraversalTime = 2.048s
*.scenarioManager.script = xmldoc("light-sleep.xml")
