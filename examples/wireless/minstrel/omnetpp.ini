[General]
network = MinstrelRateControlNetwork
abstract = true
sim-time-limit = 3s
seed-set = 0
# Width adaptation requires a medium that represents partial spectral overlap.
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
**.radio.typename = "Ieee80211DimensionalRadio"

*.configurator.assignDisjunctSubnetAddresses = false
**.arp.typename = "GlobalArp"
**.mobility.initFromDisplayString = false
*.source.mobility.initialX = 0m
*.ap.mobility.initialX = 20m
**.mobility.initialY = 0m
**.mobility.initialZ = 0m
**.wlan[*].bitrate = -1bps
**.mac.qosStation = true
**.radio.transmitter.power = 20mW
**.radio.antenna.numAntennas = 2
*.ap.wlan[0].mgmt.ssid = "minstrel"
*.ap.wlan[0].mgmt.beaconInterval = 20ms
*.source.wlan[0].mgmt.typename = "Ieee80211MgmtSta"
*.source.wlan[0].mgmt.numChannels = 1
*.source.wlan[0].agent.typename = "Ieee80211AgentSta"
*.source.wlan[0].agent.defaultSsid = "minstrel"
*.source.wlan[0].agent.startingTime = 0s
*.source.wlan[0].agent.probeDelay = 1ms
*.source.wlan[0].agent.minChannelTime = 5ms
*.source.wlan[0].agent.maxChannelTime = 10ms

*.source.wlan[0].mac.hcf.rateControl.typename = "MinstrelHtRateControl"
*.source.wlan[0].mac.*.rateSelection.dataFrameBitrate = -1bps
*.source.numApps = 1
*.source.app[0].typename = "UdpBasicApp"
*.source.app[0].destAddresses = "sink"
*.source.app[0].destPort = 5000
*.source.app[0].messageLength = 1000B
*.source.app[0].sendInterval = 1ms
*.source.app[0].startTime = 100ms
*.sink.numApps = 1
*.sink.app[0].typename = "UdpSink"
*.sink.app[0].localPort = 5000

[Config Ht]
description = "Minstrel with negotiated HT MCS and guard interval, 20 MHz"
**.wlan[*].opMode = "n(mixed-2.4Ghz)"
**.radio.bandName = "2.4 GHz"
**.radio.channelNumber = 6
*.source.wlan[0].agent.channelsToScan = "6"

[Config Vht]
description = "Minstrel with configured VHT capabilities, up to 80 MHz and two streams"
**.wlan[*].opMode = "ac"
**.radio.bandName = "5 GHz"
**.radio.channelNumber = 42
**.radio.bandwidth = 80MHz
*.source.wlan[0].agent.channelsToScan = "42"
*.source.wlan[0].mac.*.rateControl.maxChannelWidth = 80MHz
*.source.wlan[0].mac.*.rateControl.maxNumSpatialStreams = 2
