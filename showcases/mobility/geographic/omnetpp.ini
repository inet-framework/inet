[General]
network = GeographicMobilityShowcase

*.coordinateSystem.typename = "Wgs84EcefGeographicCoordinateSystem"

*.map.mapImage = "maps/world-er"
*.map.minLongitude = -170deg
*.map.maxLongitude = 190deg

*.geoHorizon.coordinateSystemModule = "^.coordinateSystem"
*.geoHorizon.mapVisualizer = "^.map"
*.skyView.coordinateSystemModule = "^.coordinateSystem"

[Config Aircraft]
description = "Four planes replay GNSS tracks between major airports"
sim-time-limit = 48h
*.numPlanes = 4
*.hasEuropeMap = true

**.epoch = "2000-06-28T00:20:19Z"

*.plane[*].mobility.typename = "GnssTrackMobility"
*.plane[*].mobility.coordinateSystemModule = "^.^.coordinateSystem"
*.plane[*].mobility.updateInterval = 60s
*.plane[*].mobility.updateDisplayString = true
*.plane[*].mobility.loopMode = "pingPong"

*.plane[0].display-name = "JFK - LHR"
*.plane[0].mobility.trackData = "40.64,-73.78,0,0\n40.64,-73.78,0,1800\n43.63,-68.40,10000,4000\n52.75,-8.30,10000,21600\n51.47,-0.45,0,23800\n51.47,-0.45,0,25600"
*.plane[1].display-name = "LAX - HND"
*.plane[1].mobility.trackData = "33.94,-118.41,0,0\n33.94,-118.41,0,1800\n38.31,-126.60,10000,5300\n39.72,148.30,10000,33300\n35.55,139.78,0,36800\n35.55,139.78,0,38600"
*.plane[2].display-name = "DXB - GRU"
*.plane[2].mobility.trackData = "25.25,55.36,0,0\n25.25,55.36,0,1800\n21.56,44.08,10000,6600\n-19.35,-35.51,10000,45000\n-23.43,-46.47,0,49800\n-23.43,-46.47,0,51600"
*.plane[3].display-name = "LHR - BUD"
*.plane[3].mobility.trackData = "51.47,-0.45,0,0\n51.47,-0.45,0,1800\n51.20,1.62,10000,2400\n47.79,17.30,10000,7200\n47.43,19.26,0,7800\n47.43,19.26,0,9600"

*.planeVisualizer.zIndex = -1
*.planeVisualizer.moduleFilter = "**.plane[*].mobility"
*.planeVisualizer.displayPositions = false
*.planeVisualizer.displayMovementTrails = true
*.planeVisualizer.movementTrailSegmentHideThreshold = 100
*.stationVisualizer.moduleFilter = "**.europe.mobility"
*.stationVisualizer.displayPositions = true
*.geoHorizon.moduleFilter = "**.plane[*].mobility"
*.skyView.displaySkyView = false

*.europe.mobility.coordinateSystemModule = "^.^.coordinateSystem"
*.europe.mobility.initFromDisplayString = false
*.europe.mobility.updateFromDisplayString = false
*.europe.mobility.updateDisplayString = true
*.europe.mobility.initialLatitude = 48.8566deg
*.europe.mobility.initialLongitude = 2.3522deg
*.europe.mobility.initialAltitude = 0m

*.europe.map.mapImage = "maps/europe-er"
*.europe.map.minLatitude = 37.0deg
*.europe.map.maxLatitude = 73.0deg
*.europe.map.minLongitude = -13.8deg
*.europe.map.maxLongitude = 44.3deg
*.europe.map.mapWidth = 654
*.europe.map.mapHeight = 622
*.europe.mobilityVisualizer.visualizationSubjectModule = "^.^"
*.europe.mobilityVisualizer.moduleFilter = "**.plane[*].mobility"
*.europe.mobilityVisualizer.displayPositions = true
*.europe.mobilityVisualizer.displayMovementTrails = true
*.europe.mobilityVisualizer.zIndex = -1
*.europe.geoHorizon.visualizationSubjectModule = "^.^"
*.europe.geoHorizon.coordinateSystemModule = "^.^.coordinateSystem"
*.europe.geoHorizon.mapVisualizer = "^.map"
*.europe.geoHorizon.moduleFilter = "**.plane[*].mobility"
*.europe.networkNodeVisualizer.visualizationSubjectModule = "^.^"
*.europe.networkNodeVisualizer.nodeFilter = "plane[*]"
*.europe.infoVisualizer.modules = "**.plane[*]"
*.europe.infoVisualizer.format = "%N"
*.europe.infoVisualizer.backgroundColor = ""
*.europe.infoVisualizer.placementHint = "bottom"

*.europe.budapest.mobility.coordinateSystemModule = "^.^.^.coordinateSystem"
*.europe.budapest.mobility.initFromDisplayString = false
*.europe.budapest.mobility.updateFromDisplayString = false
*.europe.budapest.mobility.updateDisplayString = true
*.europe.budapest.mobility.initialLatitude = 47.53771deg
*.europe.budapest.mobility.initialLongitude = 19.0334deg
*.europe.budapest.mobility.initialAltitude = 100m
*.europe.budapest.coordinateSystem.sceneLatitude = 47.53771deg
*.europe.budapest.coordinateSystem.sceneLongitude = 19.0334deg
*.europe.budapest.map.mapFile = xmldoc("../../../examples/openstreetmap/obuda.osm")

[Config Satellites]
description = "Vanguard 1 and the ISS propagated from TLEs with SGP4, seen from two ground stations"
sim-time-limit = 24h
*.numSatellites = 2
*.numGroundStations = 2

**.epoch = "2026-10-26T00:00:00Z"

*.satellite[*].mobility.typename = "SatelliteMobility"
*.satellite[*].mobility.tleData = readFile("satellites.tle")
*.satellite[*].mobility.coordinateSystemModule = "^.^.coordinateSystem"
*.satellite[*].mobility.updateInterval = 10s
*.satellite[*].mobility.updateDisplayString = true
*.satellite[*].mobility.attitudeMode = "velocity"
*.satellite[0].mobility.satelliteName = "VANGUARD 1"
*.satellite[0].display-name = "Vanguard 1"
*.satellite[1].mobility.satelliteName = "ISS (ZARYA)"
*.satellite[1].display-name = "ISS"

*.groundStation[*].mobility.coordinateSystemModule = "^.^.coordinateSystem"
*.groundStation[*].mobility.initFromDisplayString = false
*.groundStation[*].mobility.updateFromDisplayString = false
*.groundStation[*].mobility.updateDisplayString = true
*.groundStation[*].mobility.displayStringTextFormat = "{geo_position}"
*.groundStation[0].display-name = "Lima"
*.groundStation[0].mobility.initialLatitude = -12.046deg
*.groundStation[0].mobility.initialLongitude = -77.043deg
*.groundStation[0].mobility.initialAltitude = 154m
*.groundStation[1].display-name = "Los Angeles"
*.groundStation[1].mobility.initialLatitude = 34.052deg
*.groundStation[1].mobility.initialLongitude = -118.244deg
*.groundStation[1].mobility.initialAltitude = 89m

*.satelliteVisualizer.moduleFilter = "**.satellite[*].mobility"
*.satelliteVisualizer.displayPositions = false
*.satelliteVisualizer.displayMovementTrails = true
*.satelliteVisualizer.movementTrailSegmentHideThreshold = 100
*.satelliteVisualizer.trailLength = 1700
*.satelliteVisualizer.displayOrientations = true
*.satelliteVisualizer.displayVelocities = true
*.satelliteVisualizer.velocityProjection = "isometric"
*.satelliteVisualizer.orientationProjection = "isometric"
*.satelliteVisualizer.velocityArrowScale = 300
*.geoHorizon.moduleFilter = "**.satellite[*].mobility"
*.skyView.observerFilter = "**.groundStation[*].mobility"
*.skyView.targetFilter = "**.satellite[*].mobility"
*.skyView.elevationMask = 10deg
*.geoHorizon.elevationMask = 10deg
