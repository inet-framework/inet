[General]
network = inet.showcases.ethernet.tenbaset1s.MultidropNetwork
seed-set = ${repetition}
**.vector-recording = false

*.controller.typename = "EthernetPlcaHost"
*.node[*].typename = "EthernetPlcaHost"
*.*.ethernet.hasSocketSupport = true

*.node[*].numApps = 2
*.node[*].app[0].typename = "EthernetSourceApp"
*.node[*].app[0].io.interface = "eth0"
*.node[*].app[0].io.remoteAddress = "controller"
*.node[*].app[0].source.packetLength = 46B
*.node[*].app[1].typename = "EthernetSinkApp"
*.node[*].app[1].io.interface = "eth0"
*.node[*].app[1].io.steal = true
*.node[*].app[1].io.localAddress = "node[" + string(ancestorIndex(2)) + "]"

*.controller.app[0].typename = "EthernetSinkApp"
*.controller.app[0].io.interface = "eth0"
*.controller.app[0].io.steal = true
*.controller.app[0].io.localAddress = "controller"
*.controller.app[0].io.remoteAddress = ""
*.controller.app[*].typename = "EthernetSourceApp"
*.controller.app[*].io.interface = "eth0"
*.controller.app[*].io.remoteAddress = "node[" + string(ancestorIndex(1) - 1) + "]"
*.controller.app[*].source.packetLength = 46B

[Config PlcaBase]
abstract = true
*.*.eth[*].plca.max_bc = 0

[Config CsmaCdBase]
abstract = true
**.plca.typename = ""

[Config CycleAnatomy]
extends = PlcaBase
sim-time-limit = 2ms
**.vector-recording = true
*.numNodes = 8
*.controller.numApps = 9
*.node[*].app[0].source.productionInterval = 1.25 * 8 * 68us * 100 / 30
*.node[*].app[0].source.initialProductionOffset = 100us
*.controller.app[*].source.productionInterval = 10ms
*.controller.app[*].source.initialProductionOffset = 10ms

[Config PlcaLatency]
extends = PlcaBase
sim-time-limit = 2s
repeat = 3
*.numNodes = ${N=8,16}
*.controller.numApps = 1 + ${N}
*.node[*].app[0].source.productionInterval = uniform(0.9, 1.1) * 1.25 * ${N} * 68us * 100 / ${load=30,50,70,85}
*.node[*].app[0].source.initialProductionOffset = uniform(0s, 1.25 * ${N} * 68us * 100 / ${load})
*.controller.app[*].source.productionInterval = uniform(0.9, 1.1) * 4 * 1.25 * ${N} * 68us * 100 / ${load}
*.controller.app[*].source.initialProductionOffset = uniform(0s, 4 * 1.25 * ${N} * 68us * 100 / ${load})
*.*.eth[*].plca.packetPendingDelay:vector.vector-recording = true
*.*.eth[*].mac.packetPendingDelay:vector.vector-recording = true

[Config CsmaCdLatency]
extends = CsmaCdBase
sim-time-limit = 2s
repeat = 10
*.numNodes = 8
*.controller.numApps = 9
*.node[*].app[0].source.productionInterval = uniform(0.9, 1.1) * 1.25 * 8 * 68us * 100 / ${load=30,50,70,85}
*.node[*].app[0].source.initialProductionOffset = uniform(0s, 1.25 * 8 * 68us * 100 / ${load})
*.controller.app[*].source.productionInterval = uniform(0.9, 1.1) * 4 * 1.25 * 8 * 68us * 100 / ${load}
*.controller.app[*].source.initialProductionOffset = uniform(0s, 4 * 1.25 * 8 * 68us * 100 / ${load})
*.*.eth[*].mac.packetPendingDelay:vector.vector-recording = true

[Config Scale40Plca]
extends = PlcaBase
sim-time-limit = 2s
*.numNodes = 40
*.controller.numApps = 41
*.node[*].app[0].source.productionInterval = uniform(0.9, 1.1) * 1.25 * 40 * 68us * 100 / 85
*.node[*].app[0].source.initialProductionOffset = uniform(0s, 1.25 * 40 * 68us * 100 / 85)
*.controller.app[*].source.productionInterval = uniform(0.9, 1.1) * 8 * 1.25 * 40 * 68us * 100 / 85
*.controller.app[*].source.initialProductionOffset = uniform(0s, 8 * 1.25 * 40 * 68us * 100 / 85)
*.*.eth[*].plca.packetPendingDelay:vector.vector-recording = true
*.*.eth[*].mac.packetPendingDelay:vector.vector-recording = true

[Config PlcaUtilization]
extends = PlcaBase
sim-time-limit = 2.1s
warmup-period = 0.1s
*.numNodes = 8
*.controller.numApps = 9
*.node[*].app[0].source.packetLength = ${payloadLength=1500,46}B
*.controller.app[*].source.packetLength = ${payloadLength}B
*.node[*].app[0].source.productionInterval = 200us
*.controller.app[*].source.productionInterval = 200us
*.*.eth[*].phy.busUsed.result-recording-modes = +timeavg
*.controller.eth[*].phy.busUtilization:vector.vector-recording = true

[Config CsmaCdUtilization]
extends = CsmaCdBase
sim-time-limit = 2.1s
warmup-period = 0.1s
repeat = 10
*.numNodes = 8
*.controller.numApps = 9
*.node[*].app[0].source.packetLength = ${payloadLength=1500,46}B
*.controller.app[*].source.packetLength = ${payloadLength}B
*.node[*].app[0].source.productionInterval = 200us
*.controller.app[*].source.productionInterval = 200us
