[General]
abstract = true
network = RateControlShowcase
sim-time-limit = 25s

*.*Host.mobility.constraintAreaMinX = 0m
*.*Host.mobility.constraintAreaMinY = 0m
*.*Host.mobility.constraintAreaMinZ = 0m
*.*Host.mobility.constraintAreaMaxX = 1300m
*.*Host.mobility.constraintAreaMaxY = 400m
*.*Host.mobility.constraintAreaMaxZ = 50m

*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"
*.radioMedium.backgroundNoise.power = -100dBm
*.*Host.*.arp.typename = "GlobalArp"
*.configurator.addStaticRoutes = false

# environment settings
*.physicalEnvironment.config = xmldoc("obstacles.xml")
*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = 0m
*.physicalEnvironment.spaceMaxX = 1300m
*.physicalEnvironment.spaceMaxY = 400m
*.physicalEnvironment.spaceMaxZ = 50m

# visualization settings
*.visualizer.obstacleLossVisualizer.displayIntersections = true
*.visualizer.obstacleLossVisualizer.fadeOutTime = 40ms
*.visualizer.obstacleLossVisualizer.fadeOutMode = "animationTime"
*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.dataLinkVisualizer.packetFilter = "Udp*"
*.visualizer.dataLinkVisualizer.fadeOutMode = "animationTime"
*.visualizer.dataLinkVisualizer.fadeOutTime = 200ms

# nic settings
*.*Host.wlan[*].opMode = "g(erp)"
*.*Host.wlan[*].radio.transmitter.power = 50mW
*.*Host.wlan[*].mgmt.typename = "Ieee80211MgmtAdhoc"
*.*Host.wlan[*].agent.typename = ""

# application settings
*.*Host.numApps = 1

*.sourceHost.app[0].typename = "UdpBasicApp"
*.sourceHost.app[0].destAddresses = "sinkHost"
*.sourceHost.app[0].destPort = 5000
*.sourceHost.app[0].messageLength = 1000B
*.sourceHost.app[0].sendInterval = 0.1ms

*.sinkHost.app[0].typename = "UdpSink"
*.sinkHost.app[0].localPort = 5000

# mobility settings
*.*Host.mobility.typename = "RectangleMobility"
*.sourceHost.mobility.startPos = 0
*.sourceHost.mobility.speed = 200mps
*.sinkHost.mobility.startPos = 3
*.sinkHost.mobility.speed = 100mps

[Config NoRateControl]
*.*Host.wlan[*].mac.*.rateControl.typename = ""
*.*Host.wlan[*].mac.*.rateSelection.dataFrameBitrate = 54Mbps    # use 54Mbps rate when not using rate control

[Config AarfRateControl]
seed-set = 1    # only for unchanged fingerprints
*.*Host.wlan[*].mac.*.rateControl.typename = "AarfRateControl"
*.*Host.wlan[*].mac.*.rateControl.initialRate = 54Mbps
*.*Host.wlan[*].mac.*.rateSelection.dataFrameBitrate = -1bps   # let ratecontrol set the rate
*.*Host.wlan[*].mac.dcf.rateControl.increaseThreshold = 20
*.*Host.wlan[*].mac.dcf.rateControl.decreaseThreshold = 5
*.*Host.wlan[*].mac.dcf.rateControl.interval = 1s

# Rate control picks a different rate per station: a wall in front of sta[0] settles its link
# near 6 Mbps while the other four stay at 54 Mbps.
[Config PerStationRates]
description = "Rate control settles on a different rate for each client: a wall in front of sta[0] drops its link to ~6 Mbps while the others stay at 54 Mbps"
network = PerStationRatesShowcase
sim-time-limit = 5s
warmup-period = 1s

*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
*.*.ipv4.arp.typename = "GlobalArp"
*.configurator.addStaticRoutes = true

# small indoor scene (override the ratecontrol outdoor [General] environment)
*.radioMedium.backgroundNoise.power = -95dBm
*.radioMedium.obstacleLoss.typename = "DielectricObstacleLoss"
*.physicalEnvironment.config = xmldoc("obstacle.xml")
*.physicalEnvironment.spaceMinX = 0m
*.physicalEnvironment.spaceMinY = 0m
*.physicalEnvironment.spaceMinZ = -2m
*.physicalEnvironment.spaceMaxX = 30m
*.physicalEnvironment.spaceMaxY = 24m
*.physicalEnvironment.spaceMaxZ = 3m

# station cluster + AP; realistic indoor radio so lower 802.11g rates are in play
*.sta[*].mobility.typename = "StationaryMobility"
*.sta[*].mobility.initFromDisplayString = false
*.sta[*].mobility.initialX = 9m
*.sta[*].mobility.initialY = 8m + parentIndex() * 2m
*.sta[*].mobility.initialZ = 0m
*.accessPoint.mobility.initialX = 17m
*.accessPoint.mobility.initialY = 12m
*.accessPoint.mobility.initialZ = 0m
*.sta[*].wlan[*].opMode = "g(erp)"
*.accessPoint.wlan[*].opMode = "g(erp)"
*.sta[*].wlan[*].radio.transmitter.power = 100mW
*.accessPoint.wlan[*].radio.transmitter.power = 100mW
*.radioMedium.pathLoss.alpha = 4
**.wlan[*].radio.receiver.sensitivity = -92dBm
**.wlan[*].radio.receiver.energyDetection = -92dBm

# pre-associated mgmt (a weak-link client would not reliably associate)
*.accessPoint.wlan[*].mgmt.typename = "Ieee80211MgmtApSimplified"
*.sta[*].wlan[*].mgmt.typename = "Ieee80211MgmtStaSimplified"
*.sta[*].wlan[*].agent.typename = ""
*.accessPoint.wlan[*].address = "10:00:00:00:00:00"
*.sta[*].wlan[*].mgmt.accessPointAddress = "10:00:00:00:00:00"

# rate control on the AP -> AARF settles the walled sta[0] link at ~6 Mbps, the rest at 54 Mbps
*.accessPoint.wlan[*].mac.dcf.rateSelection.dataFrameBitrate = -1bps
*.accessPoint.wlan[*].mac.dcf.rateControl.typename = "AarfRateControl"

# downlink saturating traffic: server -> each station
*.sta[*].numApps = 1
*.sta[*].app[0].typename = "UdpSink"
*.sta[*].app[0].localPort = 5000 + parentIndex()
*.server.numApps = 5
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "sta[" + string(index) + "]"
*.server.app[*].destPort = 5000 + index
*.server.app[*].messageLength = 1000B
*.server.app[*].sendInterval = 1ms

*.accessPoint.wlan[*].mac.dcf.channelAccess.pendingQueue.packetCapacity = 50

# rate visualizer: per-client PHY rate bar chart above the AP, from AARF's datarateChanged signal
*.visualizer.rateVisualizer.displayRates = true
*.visualizer.rateVisualizer.maxRate = 54Mbps

*.visualizer.dataLinkVisualizer.displayLinks = true
*.visualizer.dataLinkVisualizer.packetFilter = "Udp*"
*.visualizer.dataLinkVisualizer.labelFormat = ""
*.visualizer.dataLinkVisualizer.fadeOutMode = "simulationTime"
*.visualizer.dataLinkVisualizer.fadeOutTime = 5ms

# only real reception errors; the enum renders as "3 (INCORRECTLY_RECEIVED)", hence the wildcards.
# Without the filter every station also reports NOT_ADDRESSED_TO_US for each overheard frame.
*.visualizer.packetDropVisualizer.displayPacketDrops = true
*.visualizer.packetDropVisualizer.detailsFilter = "reason =~ *INCORRECTLY_RECEIVED*"
*.visualizer.packetDropVisualizer.labelFormat = ""
*.visualizer.packetDropVisualizer.fadeOutMode = "simulationTime"
*.visualizer.packetDropVisualizer.fadeOutTime = 10ms
