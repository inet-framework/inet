[General]
network = RateAnomalyShowcase
sim-time-limit = 5s
warmup-period = 1s   # discard the association transient, measure steady state

# simultaneous DCF backoff expiry is a real collision here, not a misconfiguration
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
*.*.ipv4.arp.typename = "GlobalArp"

# stations spread along a line 8-11 m from the access point; every link is error-free
# at every rate, so the spread costs no throughput and keeps the per-station readouts apart
*.sta[*].mobility.typename = "StationaryMobility"
*.sta[*].mobility.initFromDisplayString = false
*.sta[*].mobility.initialX = 9m
*.sta[*].mobility.initialY = 4m + parentIndex() * 4m
*.sta[*].mobility.initialZ = 0m
*.accessPoint.mobility.initialX = 17m
*.accessPoint.mobility.initialY = 12m
*.accessPoint.mobility.initialZ = 0m

*.sta[*].wlan[*].opMode = "g(erp)"
*.accessPoint.wlan[*].opMode = "g(erp)"
*.sta[*].wlan[*].bitrate = 54Mbps
*.accessPoint.wlan[*].bitrate = 54Mbps
*.sta[*].wlan[*].radio.transmitter.power = 100mW
*.accessPoint.wlan[*].radio.transmitter.power = 100mW
*.sta[*].wlan[*].mac.dcf.channelAccess.pendingQueue.packetCapacity = 10

# ==== Uplink form: stations contend for the channel (cured by 802.11e TXOP) ====

[Config UplinkBase]
abstract = true
description = "Saturating uplink - every station floods the server (abstract base)"
*.sta[*].numApps = 1
*.sta[*].app[0].typename = "UdpBasicApp"
*.sta[*].app[0].destAddresses = "server"
*.sta[*].app[0].destPort = 5000 + parentIndex()
*.sta[*].app[0].messageLength = 1000B
*.sta[*].app[0].sendInterval = 0.25ms
*.server.numApps = 5
*.server.app[*].typename = "UdpSink"
*.server.app[*].localPort = 5000 + index

[Config UplinkHomogeneous]
extends = UplinkBase
description = "Uplink baseline: all five stations transmit at 54 Mbps - fair and high-throughput"

[Config UplinkAnomaly]
extends = UplinkBase
description = "Uplink anomaly: one station slowed (bitrate swept 36..6 Mbps); the fast stations collapse too"
*.sta[0].wlan[*].bitrate = ${slowBitrate=36,24,18,12,9,6}Mbps

[Config UplinkTxop]
extends = UplinkAnomaly
description = "Uplink fix: same rate gap, but 802.11e airtime-based TXOP cures the anomaly"

*.sta[*].wlan[*].mac.qosStation = true
*.accessPoint.wlan[*].mac.qosStation = true
*.sta[*].wlan[*].mac.hcf.edca.edcaf[1].txopProcedure.txopLimit = 3.008ms
*.sta[*].wlan[*].mac.hcf.edca.edcaf[1].pendingQueue.packetCapacity = 50

# ==== Downlink form: the AP serves mixed-rate clients (cured by an airtime-fair AP queue) ====

[Config DownlinkBase]
abstract = true
description = "Downlink saturation: the AP feeds all five stations; sta[0] runs at 6 Mbps"

*.sta[*].numApps = 1
*.sta[*].app[0].typename = "UdpSink"
*.sta[*].app[0].localPort = 5000 + parentIndex()
*.server.numApps = 5
*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destAddresses = "sta[" + string(index) + "]"
*.server.app[*].destPort = 5000 + index
*.server.app[*].messageLength = 1000B
*.server.app[*].sendInterval = 1ms

*.accessPoint.wlan[*].mac.dcf.rateSelection.dataFrameBitratePerReceiver = {"sta[0].wlan[0]": 6Mbps}

# rate visualizer: per-client PHY rate above the AP, from the dcf's datarateSelected signal
# (which reports the configured per-receiver rate on each transmitted frame)
*.visualizer.rateVisualizer.displayRates = true
*.visualizer.rateVisualizer.signalName = "datarateSelected"
*.visualizer.rateVisualizer.sourceFilter = "*.accessPoint.wlan[*].mac.dcf"
*.visualizer.rateVisualizer.maxRate = 54Mbps

# info visualizer: each station's received-packet count
*.visualizer.infoVisualizer.displayInfos = true
*.visualizer.infoVisualizer.modules = "*.sta[*].app[0]"
*.visualizer.infoVisualizer.format = "%t"

*.accessPoint.wlan[*].mac.dcf.channelAccess.pendingQueue.typename = "AirtimeFairnessQueue"
*.accessPoint.wlan[*].mac.dcf.channelAccess.pendingQueue.packetCapacity = 50

[Config DownlinkAnomaly]
extends = DownlinkBase
description = "Frame-fair AP queue: sta[0]'s long frames drag the fast clients down"
*.accessPoint.wlan[*].mac.dcf.channelAccess.pendingQueue.fairnessEnabled = false

[Config DownlinkAirtimeFair]
extends = DownlinkBase
description = "Airtime-fair AP queue: the fast clients recover, sta[0] held to its share"
*.accessPoint.wlan[*].mac.dcf.channelAccess.pendingQueue.fairnessEnabled = true

[Config DownlinkHomogeneous]
extends = DownlinkBase
description = "Downlink baseline: no rate gap, the AP serves all five clients at 54 Mbps"
*.accessPoint.wlan[*].mac.dcf.rateSelection.dataFrameBitratePerReceiver = {}
*.accessPoint.wlan[*].mac.dcf.channelAccess.pendingQueue.fairnessEnabled = false
