[General]
network = Ipv6AutoconfigurationShowcase

**.ipv6.configurator.networkConfiguratorModule = "configurator"
*.configurator.assignAddressesToHosts = false
*.configurator.config = xmldoc("configurator.xml")

*.visualizer.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.interfaceTableVisualizer.format = "%a"

[Config Autoconfiguration]
description = "Hosts obtain a link-local and a global address on their own, with no server and no manual configuration"
sim-time-limit = 10s

[Config DuplicateAddress]
description = "A host carrying a cloned MAC address joins the LAN, and Duplicate Address Detection refuses its address"
sim-time-limit = 20s

**.hasStatus = true
*.scenarioManager.script = xmldoc("clone.xml")

*.host[0].eth[0].address = "0A-AA-00-00-00-10"
*.host[3].eth[0].address = "0A-AA-00-00-00-10"
*.host[3].status.initialStatus = "DOWN"
