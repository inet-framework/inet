[General]
network = Mipv6Showcase
sim-time-limit = 80s
seed-set = 1
num-rngs = 3
**.mobility.rng-0 = 2

# wireless medium
*.radioMedium.mediumLimitCache.maxTransmissionPower = 2.0mW
*.radioMedium.mediumLimitCache.minReceptionPower = -82dBm
*.radioMedium.mediumLimitCache.minInterferencePower = -82dBm
**.analogModel.ignorePartialInterference = true

# access points
*.ap*.bridging.typename = "MacRelayUnit"
*.apHome.wlan[*].mgmt.ssid = "HOME"
*.apHome.wlan[*].radio.channelNumber = 1
*.apForeign.wlan[*].mgmt.ssid = "FOREIGN"
*.apForeign.wlan[*].radio.channelNumber = 2
**.wlan[*].mgmt.beaconInterval = 0.1s

# wifi
**.wlan[*].bitrate = 2Mbps
**.wlan[*].radio.transmitter.power = 2.0mW
**.wlan[*].mac.dcf.channelAccess.cwMin = 7
*.mobileNode.wlan[*].agent.channelsToScan = "1 2"
*.mobileNode.wlan[*].agent.probeDelay = 0.1s
*.mobileNode.wlan[*].agent.minChannelTime = 0.15s
*.mobileNode.wlan[*].agent.maxChannelTime = 0.3s

# IPv6: routers advertise; hosts autoconfigure their addresses (SLAAC)
**.neighbourDiscovery.minIntervalBetweenRAs = 3s
**.neighbourDiscovery.maxIntervalBetweenRAs = 7s
**.forwarding = false
# tunneling traffic in and out of the same interface would trigger ICMPv6 Redirects
**.ipv6.ipv6.sendRedirects = false

# mobility: home -> foreign network -> home, see movement.xml
*.mobileNode.mobility.typename = "TurtleMobility"
*.mobileNode.mobility.turtleScript = xmldoc("movement.xml")
*.mobileNode.mobility.updateInterval = 0.1s
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 700m
**.mobility.constraintAreaMaxY = 400m
**.mobility.constraintAreaMaxZ = 0m

# visualization: the path the pings actually take, movement trail, and the
# mobile node's current wlan address
*.visualizer.*.networkRouteVisualizer.displayRoutes = true
*.visualizer.*.networkRouteVisualizer.packetFilter = "ping*"
*.visualizer.*.networkRouteVisualizer.lineWidth = 3
*.visualizer.*.mobilityVisualizer.displayMovementTrails = true
*.visualizer.*.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.*.interfaceTableVisualizer.nodeFilter = "mobileNode"
*.visualizer.*.interfaceTableVisualizer.interfaceFilter = "wlan*"
*.visualizer.*.interfaceTableVisualizer.format = "%6"
*.visualizer.*.interfaceTableVisualizer.placementHint = "right"

# the correspondent node pings the mobile node's home address throughout
*.correspondentNode.numApps = 1
*.correspondentNode.app[0].typename = "PingApp"
*.correspondentNode.app[0].destAddr = "2001:db8:0:1:8aa:ff:fe00:d"
*.correspondentNode.app[0].packetSize = 56B
*.correspondentNode.app[0].sendInterval = 0.5s
*.correspondentNode.app[0].startTime = 1s

[Config WithoutMipv6]
description = "The mobile node is a plain IPv6 host: reachability dies away from home"
*.mobileNode.typename = "inet.node.ipv6.StandardHost6"
*.mobileNode.numWlanInterfaces = 1
*.mobileNode.displayStringTextFormat = "AP: {.wlan[0].mib.ssid}"

[Config BidirectionalTunneling]
description = "Mobile IPv6 with route optimization disabled: traffic detours through the home agent"
*.mobileNode.ipv6.mipv6.useRouteOptimization = false
*.mobileNode.displayStringTextFormat = "AP: {.wlan[0].mib.ssid}\n{.ipv6.mipv6.mobilityStatus}"

[Config RouteOptimization]
description = "Mobile IPv6 with route optimization: correspondent traffic switches to the direct path"
*.mobileNode.displayStringTextFormat = "AP: {.wlan[0].mib.ssid}\n{.ipv6.mipv6.mobilityStatus}"
