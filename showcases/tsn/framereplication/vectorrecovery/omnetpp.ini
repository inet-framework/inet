include ../manualconfiguration/omnetpp.ini

[Config VectorRecovery]
description = "IEEE 802.1CB-2017 vector recovery on the manual FRER topology"
network = inet.showcases.tsn.framereplication.manualconfiguration.ManualConfigurationShowcase
*.*.bridging.streamRelay.merger.typename = "VectorStreamMerger"
*.*.bridging.streamRelay.merger.historyLength = 32
*.*.bridging.streamRelay.merger.resetTimeout = 10ms
*.*.bridging.streamRelay.merger.ticksPerSecond = 1000

[Config MinimumHistory]
extends = VectorRecovery
description = "Minimum supported VRA history on the redundant network"
*.*.bridging.streamRelay.merger.historyLength = 2

[Config RepeatedFailures]
extends = VectorRecovery
description = "Two switch outages and recovery resets without application interruption"
*.scenarioManager.script = xml("<script>\
    <at t='20ms'><crash module='s2a'/></at>\
    <at t='35ms'><startup module='s2a'/></at>\
    <at t='50ms'><crash module='s2a'/></at>\
    <at t='75ms'><startup module='s2a'/></at>\
</script>")

[Config Wraparound]
extends = VectorRecovery
description = "70000 frames across a complete 16-bit sequence-number wrap"
sim-time-limit = 7s
*.source.app[0].source.packetLength = 64B
*.source.app[0].source.productionInterval = 100us
*.source.app[0].source.packetLengths:vector.vector-recording = true
*.destination.app[0].sink.packetLifeTime:vector.vector-recording = true
**.vector-recording = false
