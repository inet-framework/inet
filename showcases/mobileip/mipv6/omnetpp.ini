[General]
network = MobileIpv6Showcase
sim-time-limit = 45s
repeat = 5
seed-set = ${repetition} + 1
num-rngs = 3
**.mobility.rng-0 = 2

*.homeAgentLinkDelay = 5ms

*.foreignRouter.ipv6.neighbourDiscovery.minIntervalBetweenRAs = 200s
*.foreignRouter.ipv6.neighbourDiscovery.maxIntervalBetweenRAs = 600s
**.neighbourDiscovery.minIntervalBetweenRAs = 3s
**.neighbourDiscovery.maxIntervalBetweenRAs = 7s
*.homeAgent.ipv6.ipv6.sendRedirects = false

*.radioMedium.mediumLimitCache.maxTransmissionPower = 2.0mW
*.radioMedium.mediumLimitCache.minReceptionPower = -82dBm
*.radioMedium.mediumLimitCache.minInterferencePower = -82dBm
**.radio.transmitter.power = 2.0mW
**.analogModel.ignorePartialInterference = true
**.wlan*.bitrate = 54Mbps
**.wlan*.mac.dcf.channelAccess.cwMin = 7

**.ap*.wlan*.mgmt.beaconInterval = 0.1s
*.apHome.wlan*.mgmt.ssid = "HOME"
*.apForeign.wlan*.mgmt.ssid = "FOREIGN"
*.ap*.bridging.typename = "MacRelayUnit"
*.apHome.wlan*.radio.channelNumber = 1
*.apForeign.wlan*.radio.channelNumber = 2
**.wlan*.agent.channelsToScan = "1 2"
**.wlan*.agent.probeDelay = 0.1s
**.wlan*.agent.minChannelTime = 0.15s
**.wlan*.agent.maxChannelTime = 0.3s
**.wlan*.agent.authenticationTimeout = 5s
**.wlan*.agent.associationTimeout = 5s

*.mn.mobility.typename = "TurtleMobility"
*.mn.mobility.turtleScript = xmldoc("movement.xml")
*.mn.mobility.updateInterval = 0.1s
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.constraintAreaMaxX = 900m
**.constraintAreaMaxY = 750m

*.mn.displayStringTextFormat = "AP: {.wlan[0].mib.ssid}\nHoA: 2001:db8:0:5:8aa:ff:fe00:11\nCoA: {.ipv6.mipv6.careOfAddress}\n{.ipv6.mipv6.mobilityStatus}"

*.visualizer.mobilityVisualizer.displayMovementTrails = true
*.visualizer.mobilityVisualizer.moduleFilter = "*.mn.mobility"
*.visualizer.mobilityVisualizer.movementTrailLineColor = "black"
*.visualizer.mobilityVisualizer.movementTrailLineWidth = 2
*.visualizer.mobilityVisualizer.trailLength = 200
*.visualizer.mobilityVisualizer.animationSpeed = 0.1
*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.networkRouteVisualizer.packetFilter = "ping*"
*.visualizer.networkRouteVisualizer.lineColor = "red4"
*.visualizer.networkRouteVisualizer.fadeOutMode = "simulationTime"
*.visualizer.networkRouteVisualizer.fadeOutTime = 0.5s
*.visualizer.networkRouteVisualizer.fadeOutAnimationSpeed = 0.1
*.visualizer.networkRouteVisualizer.labelFormat = ""

**.eth[*].queue.typename = "EthernetQosQueue"
**.eth[*].queue.dataQueue.typename = "DropTailQueue"
**.eth[*].queue.dataQueue.packetCapacity = 10

*.cnRouteOptimized.numApps = 1
*.cnPlain.numApps = 0
*.cn*.app[0].typename = "PingApp"
*.cn*.app[0].destAddr = "2001:db8:0:5:8aa:ff:fe00:11"
*.cn*.app[0].packetSize = 56B
*.cn*.app[0].hopLimit = 32
*.cn*.app[0].sendInterval = 100ms
*.cn*.app[0].startTime = 10s

*.cnRouteOptimized.app[0].rtt.result-recording-modes = vector
*.cnRouteOptimized.app[0].pingTxSeq.result-recording-modes = vector
*.cnRouteOptimized.app[0].pingRxSeq.result-recording-modes = vector
*.cnPlain.app[0].rtt.result-recording-modes = vector
*.cnPlain.app[0].pingTxSeq.result-recording-modes = vector
*.cnPlain.app[0].pingRxSeq.result-recording-modes = vector
**.result-recording-modes = -

[Config Baseline]
description = "Without Mobile IPv6: the mobile node is a plain IPv6 host and the flow does not survive the move"
*.mn.typename = "StandardHost6"
*.mn.numWlanInterfaces = 1
*.mn.hasIpv6 = true
*.mn.hasIpv4 = false
*.mn.displayStringTextFormat = "AP: {.wlan[0].mib.ssid}"

[Config Tunnelled]
description = "Bidirectional tunnelling through the home agent: the mandatory Mobile IPv6 spine"
*.mn.ipv6.mipv6.useRouteOptimization = false

[Config FrequentRouterAdvertisements]
description = "The same handover with the foreign router advertising every 3 to 7 seconds instead of at the deployed default"
extends = Tunnelled
*.foreignRouter.ipv6.neighbourDiscovery.minIntervalBetweenRAs = 3s
*.foreignRouter.ipv6.neighbourDiscovery.maxIntervalBetweenRAs = 7s

[Config MobilityTunedRouterAdvertisements]
description = "The same handover with the foreign router advertising every 0.3 to 0.7 seconds, a rate only a router serving mobile nodes may use"
extends = Tunnelled
*.foreignRouter.ipv6.neighbourDiscovery.minIntervalBetweenRAs = 0.3s
*.foreignRouter.ipv6.neighbourDiscovery.maxIntervalBetweenRAs = 0.7s

[Config RouteOptimized]
description = "Route optimization: the correspondent node sends straight to the care-of address"
*.mn.ipv6.mipv6.useRouteOptimization = true

[Config MixedCorrespondents]
description = "One Mobile IPv6 aware and one plain correspondent node, in the same run"
extends = RouteOptimized
*.cnPlain.numApps = 1

[Config ReturnRoutability]
description = "Return routability captured on its own: traffic starts after the mobile node has registered"
extends = RouteOptimized
repeat = 1
seed-set = 1
*.cnRouteOptimized.app[0].startTime = 40s
