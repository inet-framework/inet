[General]
network = Pmipv6Showcase
sim-time-limit = 60s
seed-set = 1
num-rngs = 3
**.mobility.rng-0 = 2

*.ar*.numWlanInterfaces = 1
*.mn.numWlanInterfaces = 1

**.mgmt.numChannels = 5
**.ar*.wlan[0].mgmt.beaconInterval = 0.1s
*.ar*.wlan[0].address = "00:00:5E:00:52:13"
*.ar1.wlan[0].mgmt.ssid = "AR1"
*.ar1.wlan[0].radio.channelNumber = 0
*.ar2.wlan[0].mgmt.ssid = "AR2"
*.ar2.wlan[0].radio.channelNumber = 1

*.mn.wlan[0].address = "0A:AA:00:00:00:0B"
*.mn.wlan[0].agent.startingTime = 3s
*.mn.wlan[0].agent.channelsToScan = "0 1"
*.mn.wlan[0].agent.probeDelay = 0.1s
*.mn.wlan[0].agent.minChannelTime = 0.15s
*.mn.wlan[0].agent.maxChannelTime = 0.3s
*.mn.wlan[0].agent.authenticationTimeout = 5s
*.mn.wlan[0].agent.associationTimeout = 5s

**.wlan[*].opMode = "g(mixed)"
**.wlan[*].bitrate = 54Mbps
**.wlan[*].mac.dcf.channelAccess.cwMin = 7
*.radioMedium.mediumLimitCache.maxTransmissionPower = 2.0mW
*.radioMedium.mediumLimitCache.minReceptionPower = -82dBm
*.radioMedium.mediumLimitCache.minInterferencePower = -82dBm
**.radio.transmitter.power = 2.0mW
**.analogModel.ignorePartialInterference = true

**.neighbourDiscovery.minIntervalBetweenRAs = 1s
**.neighbourDiscovery.maxIntervalBetweenRAs = 3s

**.mobility.initFromDisplayString = false
*.ar1.mobility.typename = "StationaryMobility"
*.ar1.mobility.initialX = 250m
*.ar1.mobility.initialY = 260m
*.ar2.mobility.typename = "StationaryMobility"
*.ar2.mobility.initialX = 550m
*.ar2.mobility.initialY = 260m
*.mn.mobility.typename = "TurtleMobility"
*.mn.mobility.turtleScript = xmldoc("movement.xml")
*.mn.mobility.updateInterval = 0.1s
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMaxX = 800m
**.constraintAreaMaxY = 500m

*.cn.numApps = 1
*.cn.app[0].typename = "PingApp"
*.cn.app[0].destAddr = "2001:db8:1:0:8aa:ff:fe00:b"
*.cn.app[0].packetSize = 56B
*.cn.app[0].sendInterval = 50ms
*.cn.app[0].startTime = 8s
*.cn.app[0].hopLimit = 32

*.cn.forwarding = false
*.mn.forwarding = false

**.eth[*].queue.typename = "EthernetQosQueue"
**.eth[*].queue.dataQueue.typename = "DropTailQueue"
**.eth[*].queue.dataQueue.packetCapacity = 100

*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.networkRouteVisualizer.packetFilter = "ping*"
*.visualizer.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.interfaceTableVisualizer.nodeFilter = "mn"
*.visualizer.interfaceTableVisualizer.interfaceFilter = "wlan[0]"
*.visualizer.interfaceTableVisualizer.format = "%a"
*.visualizer.mobilityVisualizer.displayMovementTrails = true
*.visualizer.ieee80211Visualizer.displayAssociations = true
*.visualizer.ieee80211Visualizer.nodeFilter = "mn"
*.visualizer.ieee80211Visualizer.placementHint = "bottom"

*.cn.app[0].pingTxSeq:vector.vector-recording = true
*.cn.app[0].pingRxSeq:vector.vector-recording = true
*.cn.app[0].rtt:vector.vector-recording = true
**.ipv6.pmipv6.*.vector-recording = true
*.mn.ipv6.neighbourDiscovery.startDad:vector.vector-recording = true
*.mn.ipv6.neighbourDiscovery.dadCompleted:vector.vector-recording = true
*.core.eth[*].mac.txPk:vector(packetBytes).vector-recording = true
*.ar*.eth[0].mac.txPk:vector(packetBytes).vector-recording = true
**.vector-recording = false

[Config NoPmipv6]
description = "Plain IPv6: each access router advertises its own prefix"
*.anchor.typename = "Router6"
*.ar*.typename = "Router6"
*.ar*.wlan[0].mgmt.typename = "Ieee80211MgmtAp"
*.ar*.wlan[0].agent.typename = ""
*.configurator.config = xmldoc("config-nopmipv6.xml")

[Config Pmipv6]
description = "Proxy Mobile IPv6: the network keeps the node's prefix wherever it goes"
*.anchor.typename = "LocalMobilityAnchor"
*.ar*.typename = "MobileAccessGateway"
*.configurator.config = xmldoc("config.xml")
*.ar*.ipv6.pmipv6.localMobilityAnchorAddress = "2001:db8:0::2"
*.ar*.ipv6.pmipv6.mobileNodeProfiles = xmldoc("profiles.xml")
*.anchor.ipv6.ipv6.sendRedirects = false
