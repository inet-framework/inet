[General]
network = Ipv6TunnelingShowcase
sim-time-limit = 10s

**.ipv6.configurator.networkConfiguratorModule = "configurator"
*.configurator.addStaticRoutes = false

*.visualizer.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.interfaceTableVisualizer.format = "%a"

*.visualizer.networkRouteVisualizer.displayRoutes = true
*.visualizer.networkRouteVisualizer.packetFilter = "UdpBasicAppData*"
*.visualizer.networkRouteVisualizer.fadeOutMode = "simulationTime"
*.visualizer.networkRouteVisualizer.fadeOutTime = 10s

*.visualizer.statisticVisualizer.displayStatistics = true
*.visualizer.statisticVisualizer.signalName = "packetReceived"
*.visualizer.statisticVisualizer.statisticExpression = "count"
*.visualizer.statisticVisualizer.sourceFilter = "*.hostB*.app[0]"
*.visualizer.statisticVisualizer.format = "received %v pks"

*.hostA.numApps = 2
*.hostA.app[*].typename = "UdpBasicApp"
*.hostA.app[*].destPort = 5000
*.hostA.app[*].messageLength = 100B
*.hostA.app[*].startTime = 2s
*.hostA.app[*].sendInterval = 0.5s
*.hostA.app[*].stopTime = 9.75s
*.hostA.app[0].destAddresses = "hostB1(ipv6)"
*.hostA.app[1].destAddresses = "hostB2(ipv6)"

*.hostB*.numApps = 1
*.hostB*.app[0].typename = "UdpSink"
*.hostB*.app[0].localPort = 5000

[Config NoTunnel]
description = "No tunnel: the transit network cannot route the sites' local addresses"
*.configurator.config = xmldoc("no-tunnel.xml")

[Config Tunnel]
description = "A tunnel between the border routers carries the local addresses across the transit"
*.configurator.config = xmldoc("tunnel.xml")

*.borderA.numTunInterfaces = 1
*.borderA.tun[0].typename = "Ipv6TunnelInterface"
*.borderA.tun[0].source = "2001:db8:1::1"
*.borderA.tun[0].destination = "2001:db8:2::2"

*.borderB.numTunInterfaces = 1
*.borderB.tun[0].typename = "Ipv6TunnelInterface"
*.borderB.tun[0].source = "2001:db8:2::2"
*.borderB.tun[0].destination = "2001:db8:1::1"

[Config SelectiveTunnel]
description = "A host route sends only one host's traffic into the tunnel"
extends = Tunnel
*.configurator.config = xmldoc("selective.xml")

[Config RoutingLoop]
description = "A wrong route at the far end sends packets back into the tunnel, and they loop"
extends = Tunnel
*.configurator.config = xmldoc("routing-loop.xml")
