[General]
network = PathMtuDiscoveryShowcase
sim-time-limit = 10s

**.ipv6.configurator.networkConfiguratorModule = "configurator"
*.configurator.addStaticRoutes = false
*.configurator.config = xmldoc("configurator.xml")

*.visualizer.interfaceTableVisualizer.displayInterfaceTables = true
*.visualizer.interfaceTableVisualizer.format = "%a"
*.visualizer.interfaceTableVisualizer.interfaceFilter = "not(lo*) and not(tun*)"

*.borderA.numTunInterfaces = 1
*.borderA.tun[0].typename = "Ipv6TunnelInterface"
*.borderA.tun[0].source = "2001:db8:3::1"
*.borderA.tun[0].destination = "2001:db8:4::2"

*.borderB.numTunInterfaces = 1
*.borderB.tun[0].typename = "Ipv6TunnelInterface"
*.borderB.tun[0].source = "2001:db8:4::2"
*.borderB.tun[0].destination = "2001:db8:3::1"

*.hostA.numApps = 1
*.hostA.app[0].typename = "UdpBasicApp"
*.hostA.app[0].destAddresses = "hostB(ipv6)"
*.hostA.app[0].destPort = 5000
*.hostA.app[0].startTime = 2s
*.hostA.app[0].sendInterval = 0.5s

*.hostB.numApps = 1
*.hostB.app[0].typename = "UdpSink"
*.hostB.app[0].localPort = 5000

[Config Fragmentation]
description = "The tunnel accepts the packet, and the outer header pushes it past the link limit"
*.border*.tun[0].mtu = 1500B
*.hostA.app[0].messageLength = 1452B

[Config BlackHole]
description = "The tunnel refuses the packet, and the firewall discards the message that would have said so"
*.border*.tun[0].mtu = 1460B
*.hostA.app[0].messageLength = 1452B
*.firewall.ipv6.hasIpsec = true
*.firewall.ipv6.ipsec.spdConfig = xmldoc("firewall.xml", "ipsecConfig/Devices/Device[@id='firewall']/")

[Config Discovery]
description = "The same refusal reaches the sender, which learns the path MTU and adapts"
*.border*.tun[0].mtu = 1460B
*.hostA.app[0].messageLength = 1452B

[Config SizedToFit]
description = "The sender already fits the tunnel, so nothing is fragmented anywhere"
*.border*.tun[0].mtu = 1460B
*.hostA.app[0].messageLength = 1412B
