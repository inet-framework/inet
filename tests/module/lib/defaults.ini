[General]
network = inet.test.moduletest.lib.TcpTestNet1

#default-run=1

*.testing=false

# for scriptabletester
*.tcptester.script=""

# for randomtester
*.tcptester.pdelete=0
*.tcptester.pdelay=0
*.tcptester.pcopy=0
*.tcptester.numCopies=1
*.tcptester.delayValue=0

# cient and server test apps
*.cli_app.localAddress="10.0.0.1"
*.cli_app.localPort=1000
*.cli_app.connectAddress="10.0.0.2"
*.cli_app.connectPort=2000
*.srv_app.localAddress="10.0.0.2"
*.srv_app.localPort=2000
*.srv_app.connectAddress="10.0.0.1"
*.srv_app.connectPort=1000

*.cli_app.active=true
*.srv_app.active=false
*.cli_app.tOpen=0s
*.srv_app.tOpen=0s

*.cli_app.tSend=-1s
*.srv_app.tSend=-1s
*.cli_app.sendBytes=0B
*.srv_app.sendBytes=0B
*.cli_app.sendScript=""
*.srv_app.sendScript=""

*.cli_app.tClose=-1s
*.srv_app.tClose=-1s

# tcp settings
*.*_tcp.tcpAlgorithmClass="TcpReno"
*.*_tcp.advertisedWindow = 16384
*.*_tcp.delayedAcksEnabled = true
*.*_tcp.mss = 1024

# Pin the current (legacy) TCP option/timer defaults so that a later
# defaults-modernization change (workstream B8) stays a pure src/ diff and does
# not silently shift these trace-pinning tests. These equal the current Tcp.ned
# defaults; see tests/module/*.test that also pin them explicitly (immune anyway).
*.*_tcp.sackSupport = false
*.*_tcp.windowScalingSupport = false
*.*_tcp.timestampSupport = false
*.*_tcp.limitedTransmitEnabled = false
*.*_tcp.initialWindow = "rfc2001"
*.*_tcp.initialRto = 3s
*.*_tcp.minRexmitTimeout = 1s
*.*_tcp.maxRexmitTimeout = 240s
*.*_tcp.lossDetectionMode = "dupthresh"
*.*_tcp.prrEnabled = false
*.*_tcp.lossUndoEnabled = false
*.*_tcp.adaptiveReorderingEnabled = false
*.*_tcp.tlpEnabled = false
*.*_tcp.frtoEnabled = false
*.*_tcp.seedRttFromHandshake = false

# Same pins for the ClientServer/host ("tcp") module-naming convention; the two
# patterns are disjoint (**.tcp does not match cli_tcp/srv_tcp).
**.tcp.tcpAlgorithmClass = "TcpReno"
**.tcp.delayedAcksEnabled = false
**.tcp.limitedTransmitEnabled = false
**.tcp.sackSupport = false
**.tcp.windowScalingSupport = false
**.tcp.timestampSupport = false
**.tcp.initialWindow = "rfc2001"
**.tcp.initialRto = 3s
**.tcp.minRexmitTimeout = 1s
**.tcp.maxRexmitTimeout = 240s
**.tcp.mss = 536
**.tcp.lossDetectionMode = "dupthresh"
**.tcp.prrEnabled = false
**.tcp.lossUndoEnabled = false
**.tcp.adaptiveReorderingEnabled = false
**.tcp.tlpEnabled = false
**.tcp.frtoEnabled = false
**.tcp.seedRttFromHandshake = false
*.*_tcp.keepAliveEnabled = false
