# The configuration of VlanAccessTrunkTestNetwork shared by the VLAN policy
# tests.
#
# Port names: on bridge1, eth0 (a1), eth1 (a2), eth2 (b1) and eth3 (trunk); on
# bridge2, eth0 (a3), eth1 (b2) and eth2 (trunk). The hosts a1, b1, a3 and b2
# send and receive untagged frames only; they have no 802.1Q layer. a2 sends
# priority-tagged frames (VLAN id 0) and accepts untagged frames. The access
# ports accept untagged and priority-tagged frames only, classify them into
# their VLAN, and send the frames of their VLAN untagged and no other frames;
# the trunk ports accept and send the frames of both VLANs tagged. The filters
# check the VLAN id as it is on the wire (see VlanPolicyLayer).
#
# a1 and b1 use the same MAC address, and so do a3 and b2, so a bridge that
# learned both VLANs in one forwarding space would send frames to the wrong
# port. a1 and a2 each send 64 KiB over TCP to a3, and b1 sends 64 KiB to b2.
# Only the tag inserters of the bridges and of a2 and the inbound mapper of
# bridge1 log.

[General]
network = inet.test.moduletest.lib.VlanAccessTrunkTestNetwork
sim-time-limit = 1s
cmdenv-express-mode = false
cmdenv-event-banners = false
cmdenv-log-prefix = "%M: "
record-vector-results = false

*.bridge*.ieee8021q.qTagHeaderInserter.cmdenv-log-level = info
*.a2.ieee8021q.qTagHeaderInserter.cmdenv-log-level = info
*.bridge1.bridging.vlanPolicy.inboundMapper.cmdenv-log-level = info
**.cmdenv-log-level = off

*.*.llc.typename = ""
*.*.ethernet.typename = "EthernetLayer"
*.*.eth[*].typename = "LayeredEthernetInterface"
*.*.eth[*].bitrate = 100Mbps

*.a1.eth[0].address = "02-00-00-00-01-01"
*.b1.eth[0].address = "02-00-00-00-01-01"
*.a3.eth[0].address = "02-00-00-00-01-02"
*.b2.eth[0].address = "02-00-00-00-01-02"
*.a2.eth[0].address = "02-00-00-00-01-03"

*.a2.ieee8021q.typename = "Ieee8021qProtocol"
*.a2.bridging.typename = "BridgingLayer"
*.a2.bridging.macTableModule = ""
*.a2.bridging.directionReverser.typename = ""
*.a2.bridging.interfaceRelay.typename = ""
*.a2.bridging.vlanPolicy.typename = "VlanPolicyLayer"
*.a2.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"-1" : 0}}
*.a2.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [0]}
*.a2.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1]}

*.bridge*.ieee8021q.typename = "Ieee8021qProtocol"
*.bridge*.bridging.typename = "BridgingLayer"
*.bridge*.bridging.directionReverser.reverser.forwardPcp = false
*.bridge*.bridging.vlanPolicy.typename = "VlanPolicyLayer"
*.bridge*.bridging.vlanPolicy.inboundMapper.typename = "VlanIndMapper"

*.bridge1.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 10, "0" : 10}, "eth1" : {"-1" : 10, "0" : 10}, "eth2" : {"-1" : 20, "0" : 20}}
*.bridge1.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1, 0], "eth1" : [-1, 0], "eth2" : [-1, 0], "eth3" : [10, 20]}
*.bridge1.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [-1], "eth3" : [10, 20]}
*.bridge1.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"10" : -1}, "eth1" : {"10" : -1}, "eth2" : {"20" : -1}}

*.bridge2.bridging.vlanPolicy.inboundMapper.mappedVlanIds = {"eth0" : {"-1" : 10, "0" : 10}, "eth1" : {"-1" : 20, "0" : 20}}
*.bridge2.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [-1, 0], "eth1" : [-1, 0], "eth2" : [10, 20]}
*.bridge2.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [-1], "eth1" : [-1], "eth2" : [10, 20]}
*.bridge2.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"10" : -1}, "eth1" : {"20" : -1}}

*.a1.numApps = 1
*.a1.app[0].typename = "TcpSessionApp"
*.a1.app[0].connectAddress = "a3"
*.a1.app[0].connectPort = 1000
*.a1.app[0].sendBytes = 64KiB
*.a1.app[0].tOpen = 0s
*.a1.app[0].tSend = 0s

*.a2.numApps = 1
*.a2.app[0].typename = "TcpSessionApp"
*.a2.app[0].connectAddress = "a3"
*.a2.app[0].connectPort = 1000
*.a2.app[0].sendBytes = 64KiB
*.a2.app[0].tOpen = 10ms
*.a2.app[0].tSend = 0s

*.b1.numApps = 1
*.b1.app[0].typename = "TcpSessionApp"
*.b1.app[0].connectAddress = "b2"
*.b1.app[0].connectPort = 1000
*.b1.app[0].sendBytes = 64KiB
*.b1.app[0].tOpen = 0s
*.b1.app[0].tSend = 0s

*.a3.numApps = 1
*.a3.app[0].typename = "TcpSinkApp"
*.a3.app[0].localPort = 1000

*.b2.numApps = 1
*.b2.app[0].typename = "TcpSinkApp"
*.b2.app[0].localPort = 1000
