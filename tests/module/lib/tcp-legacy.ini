# The module tests that do not include defaults.ini select LegacyTcp, the defaults of master
# before Tcp took the defaults of the RFCs: the tests were written for them, and their packet
# dumps stay the same. Include this file LAST: OMNeT++ takes the first matching entry, so a TCP
# type that the test selects comes first. The two patterns cover the TCP modules of TcpTestNet1
# (cli_tcp, srv_tcp) and of the hosts (tcp); they are disjoint.

*.*_tcp.typename = "LegacyTcp"
**.tcp.typename = "LegacyTcp"
