# The configuration of RelayVlanTestNetwork shared by the *Relay*_vlan tests.
# The test selects the relay of the switch before including this file.
#
# Three host pairs use the same two MAC addresses: a1/a2 tag their frames with
# VLAN 42, b1/b2 with VLAN 81, and c1/c2 send untagged frames. Each x1 sends
# 64 KiB over TCP to x2. The untagged pair starts first, so the switch has
# learned both MAC addresses in VLAN 0 at the ports of c1 and c2 before the
# tagged pairs start. The a and b hosts accept frames of their own VLAN only.
# a1 sends its frames with PCP 5 and DEI set. Only the tag inserter of the
# switch logs.

[General]
network = inet.test.moduletest.lib.RelayVlanTestNetwork
sim-time-limit = 1s
cmdenv-express-mode = false
cmdenv-event-banners = false
record-vector-results = false

*.switch.ieee8021q.qTagHeaderInserter.cmdenv-log-level = info
**.cmdenv-log-level = off

*.*.llc.typename = ""
*.*.ethernet.typename = "EthernetLayer"
*.*.ieee8021q.typename = "Ieee8021qProtocol"
*.*.eth[*].typename = "LayeredEthernetInterface"
*.*.eth[*].bitrate = 100Mbps

*.?1.eth[0].address = "02-00-00-00-01-01"
*.?2.eth[0].address = "02-00-00-00-01-02"

*.a*.bridging.typename = "BridgingLayer"
*.a*.bridging.macTableModule = ""
*.a*.bridging.directionReverser.typename = ""
*.a*.bridging.interfaceRelay.typename = ""
*.a*.bridging.vlanPolicy.typename = "VlanPolicyLayer"
*.a*.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"-1" : 42}}
*.a*.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [42]}
*.a*.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [42]}
*.a1.ieee8021q.qTagHeaderInserter.defaultUserPriority = 5
*.a1.ieee8021q.qTagHeaderInserter.defaultDropEligible = 1

*.b*.bridging.typename = "BridgingLayer"
*.b*.bridging.macTableModule = ""
*.b*.bridging.directionReverser.typename = ""
*.b*.bridging.interfaceRelay.typename = ""
*.b*.bridging.vlanPolicy.typename = "VlanPolicyLayer"
*.b*.bridging.vlanPolicy.outboundMapper.mappedVlanIds = {"eth0" : {"-1" : 81}}
*.b*.bridging.vlanPolicy.inboundFilter.acceptedVlanIds = {"eth0" : [81]}
*.b*.bridging.vlanPolicy.outboundFilter.acceptedVlanIds = {"eth0" : [81]}

*.?1.numApps = 1
*.?1.app[0].typename = "TcpSessionApp"
*.?1.app[0].connectPort = 1000
*.?1.app[0].sendBytes = 64KiB
*.?1.app[0].tSend = 0s
*.a1.app[0].connectAddress = "a2"
*.b1.app[0].connectAddress = "b2"
*.c1.app[0].connectAddress = "c2"
*.c1.app[0].tOpen = 0s
*.a1.app[0].tOpen = 20ms
*.b1.app[0].tOpen = 20ms

*.?2.numApps = 1
*.?2.app[0].typename = "TcpSinkApp"
*.?2.app[0].localPort = 1000
