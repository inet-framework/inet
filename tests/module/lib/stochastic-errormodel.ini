# The common configuration of the StochasticErrorModel tests (StochasticErrorModelTest):
# two hosts, 20 m apart, source sends UDP packets to sink. A test sets the parameters
# of the error model and what differs, and includes the file of the technology after
# them (the first value of a key wins).

[General]
network = inet.test.moduletest.lib.StochasticErrorModelTest
cmdenv-express-mode = true
**.vector-recording = false

*.*.ipv4.arp.typename = "GlobalArp"

*.*.mobility.typename = "StationaryMobility"
**.mobility.initFromDisplayString = false
*.source.mobility.initialX = 0m
*.source.mobility.initialY = 0m
*.source.mobility.initialZ = 0m
*.sink.mobility.initialX = 20m
*.sink.mobility.initialY = 0m
*.sink.mobility.initialZ = 0m

# the error model records the rates of the header and of the data part
**.radio.receiver.errorModel.typename = "inet.test.moduletest.lib.StochasticErrorModelProbe"

*.source.numApps = 1
*.source.app[0].typename = "UdpBasicApp"
*.source.app[0].destPort = 5000
*.source.app[0].messageLength = 1000B
*.source.app[0].sendInterval = 10ms
*.source.app[0].startTime = 1s
*.source.app[0].stopTime = 6s
*.sink.numApps = 1
*.sink.app[0].typename = "UdpSink"
*.sink.app[0].localPort = 5000
