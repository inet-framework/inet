# IEEE 802.11 ad-hoc hosts (ERP, 24 Mbit/s: OFDM with a BPSK header and 16-QAM data) with multicast
# frames, so that there are no acknowledgements or retransmissions: 500 frames of 40 header
# and 8528 data bits (the SIGNAL field; 1064 byte PSDU, 6 tail and 10 padding bits).
# See stochastic-errormodel.ini.

[General]
sim-time-limit = 6s
*.radioMedium.typename = "Ieee80211ScalarRadioMedium"
*.radioMedium.backgroundNoise.power = -100dBm

*.*.wlan[*].opMode = "g(erp)"
*.*.wlan[*].mgmt.typename = "Ieee80211MgmtAdhoc"
*.*.wlan[*].agent.typename = ""

*.source.app[0].destAddresses = "224.0.1.1"
*.source.app[0].multicastInterface = "wlan0"
*.sink.app[0].multicastGroup = "224.0.1.1"

include stochastic-errormodel.ini
