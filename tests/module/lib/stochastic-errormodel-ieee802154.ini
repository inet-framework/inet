# IEEE 802.15.4 narrowband hosts (250 kbit/s, DSSS-OQPSK-16: 4 bits per symbol) with unicast
# frames of 87 bytes, acknowledged but not retransmitted: 500 frames of 16 header and 696 data
# bits. See stochastic-errormodel.ini.

[General]
sim-time-limit = 11.5s
*.source.app[0].messageLength = 50B
*.source.app[0].sendInterval = 20ms
*.source.app[0].stopTime = 11s

*.radioMedium.typename = "Ieee802154NarrowbandScalarRadioMedium"
*.radioMedium.backgroundNoise.power = -110dBm

*.*.wlan[*].typename = "Ieee802154NarrowbandInterface"
*.*.wlan[*].mac.macMaxFrameRetries = 0

*.source.app[0].destAddresses = "sink"

include stochastic-errormodel.ini
