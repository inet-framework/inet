# APSK hosts (CsmaCaInterface, ApskRadio, scalar analog model, 100 Mbit/s, 64-QAM: 6 bits per
# symbol) with unicast frames without acknowledgements: 500 frames of 64 header and 8396 data
# bits (the MAC frame). See stochastic-errormodel.ini.

[General]
sim-time-limit = 6s
*.radioMedium.typename = "inet.physicallayer.wireless.common.medium.RadioMedium"
*.radioMedium.backgroundNoise.power = -110dBm

*.*.wlan[*].typename = "CsmaCaInterface"
*.*.wlan[*].mac.bitrate = 100Mbps
*.*.wlan[*].mac.useAck = false
*.*.wlan[*].radio.typename = "ApskRadio"
*.*.wlan[*].radio.signalAnalogRepresentation = "scalar"
*.*.wlan[*].radio.centerFrequency = 2GHz
*.*.wlan[*].radio.bandwidth = 20MHz
*.*.wlan[*].radio.transmitter.power = 1mW
*.*.wlan[*].radio.transmitter.bitrate = 100Mbps
*.*.wlan[*].radio.transmitter.preambleDuration = 1us
*.*.wlan[*].radio.transmitter.headerLength = 64b
*.*.wlan[*].radio.transmitter.modulation = "QAM-64"
*.*.wlan[*].radio.receiver.sensitivity = -100dBm
*.*.wlan[*].radio.receiver.energyDetection = -100dBm
*.*.wlan[*].radio.receiver.snirThreshold = 0dB

*.source.app[0].destAddresses = "sink"

include stochastic-errormodel.ini
