# The configuration of SocketCommandTestNetwork shared by the
# *SocketCommandWithoutSocketSupport tests. Each test opens a socket in host2
# on a protocol layer whose hasSocketSupport is false, so the socket command
# that the socket sends at startup has no socket command processor to go to.
# Before the protocol layers rejected such a command, it circled between the
# layer and the node's dispatchers at t = 0; the CPU time limit ends such a
# loop.

[General]
network = inet.test.moduletest.lib.SocketCommandTestNetwork
sim-time-limit = 1ms
cpu-time-limit = 5s
cmdenv-express-mode = true
record-vector-results = false
**.cmdenv-log-level = off

*.*.eth[*].typename = "LayeredEthernetInterface"
*.*.eth[*].bitrate = 100Mbps
*.*.ethernet.typename = "EthernetLayer"
