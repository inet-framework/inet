# The settings of every parameter test of TCP.
#
# A test writes its own lines first and includes this file last: in an ini file, the first
# line that matches a key wins, so a line of the test takes the place of a line here. The
# path is relative to the work folder of the test: include ../../parameter/ini/_base.ini
network = inet.protocoltest.TapPairNetwork
sim-time-limit = 10s
seed-set = 0

# The module under test is the TCP of INET with the defaults of Tcp, not of LinuxTcp or
# LegacyTcp.
**.tcp.typename = "Tcp"
