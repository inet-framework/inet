# The scenario "bulk": host1 opens a connection to host2 at 0.1 s and sends 10000 bytes at
# 0.2 s; host2 reads the data at once and sends nothing back. A test changes the amount or
# the times with its own lines before the include.
*.host1.numApps = 1
*.host1.app[0].typename = "TcpSessionApp"
*.host1.app[0].connectAddress = "host2"
*.host1.app[0].connectPort = 1000
*.host1.app[0].tOpen = 0.1s
*.host1.app[0].tSend = 0.2s
*.host1.app[0].sendBytes = 10000B
# A time after the end of the run keeps the connection open; with -1, TcpSessionApp closes it at
# once after its last send.
*.host1.app[0].tClose = 1000s
*.host2.numApps = 1
*.host2.app[0].typename = "TcpEchoApp"
*.host2.app[0].localPort = 1000
*.host2.app[0].echoFactor = 0
