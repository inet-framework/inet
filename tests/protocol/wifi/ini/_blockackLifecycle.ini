# Basic compatibility tests use real association and production MAC exchanges.
[General]
cmdenv-express-mode = true
cmdenv-event-banners = false
**.cmdenv-log-level = warn
**.wlan[*].mac.hcf.typename = "inet.protocoltest.wifi.BlockAckLifecycleHcf"
**.wlan[*].classifier.udpPortUpMap = "5000 VO 5001 VO"
**.wlan[*].mac.hcf.isBlockAckSupported = true
**.wlan[*].mac.hcf.blockAckVariant = "basic"
**.wlan[*].mac.hcf.originatorBlockAckAgreementPolicy.blockAckTimeoutValue = 0s
**.wlan[*].mac.hcf.recipientBlockAckAgreementPolicy.blockAckTimeoutValue = 0s
**.hcf.originatorMacDataService.fragmentationPolicy.fragmentationThreshold = 10000B
**.hcf.originatorMacDataService.msduAggregationPolicy.subframeNumThreshold = 100
**.hcf.originatorMacDataService.msduAggregationPolicy.aggregationLengthThreshold = 100000
**.hcf.originatorAckPolicy.maxBlockAckPolicyFrameLength = 10000B
**.hcf.originatorAckPolicy.blockAckReqThreshold = 5
*.ap.wlan[*].address = "02:00:00:00:00:01"
*.sta1.wlan[*].address = "02:00:00:00:00:03"
*.sta2.wlan[*].address = "02:00:00:00:00:04"
*.ap.wlan[*].mgmt.ssid = "lifecycle"
*.sta*.wlan[*].agent.defaultSsid = "lifecycle"
*.sta*.wlan[*].agent.channelsToScan = "0"
*.sta1.wlan[*].agent.startingTime = 0s
*.sta2.wlan[*].agent.startingTime = 0.2s
include _n.ini
include _base.ini
