[General]
seed-set = 0
sim-time-limit = 300ms
**.vector-recording = false
*.station[*].wlan[0].typename = "Ieee80211MeshInterface"
*.station[*].forwarding = false
*.station[*].numApps = 0
*.station[*].hasIpv6 = false
*.station[*].mobility.initFromDisplayString = false
*.station[*].mobility.initialY = 20m
*.station[*].mobility.initialZ = 0m
*.station[0].mobility.initialX = 20m
*.station[1].mobility.initialX = 30m
*.station[2].mobility.initialX = 40m
*.station[3].mobility.initialX = 50m
**.bandName = "5 GHz (20 MHz)"
**.centerFrequency = 5GHz
**.wlan[*].radio.transmitter.power = 100mW
**.wlan[*].radio.receiver.sensitivity = -85dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB
**.wlan[*].radio.receiver.bandwidth = 20MHz
# Simultaneous discrete backoff slots are deliberate collision stimuli here.
*.radioMedium.sameTransmissionStartTimeCheck = "ignore"
